<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swarm Protocol // Skin lab</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/fonts.css">
<!-- Skin lab: a standalone prototype of the in-game HUD in two new skins,
     to decide on the look before anything touches the game (the
     prototype-then-integrate workflow). Same layout as the game's HUD
     (1536x1024 design surface, scaled to the window), static sample data,
     a live 2D sketch of the solar system in the viewport. Opens from disk.
       TERMINAL — monochrome green phosphor CRT: scanlines, glow, flicker,
                  box-drawing frames, block-character bars, radar sweep
       SYNTAX   — a colourful code-editor theme: syntax-highlight palette,
                  editor tabs and gutters, function-call buttons, a status
                  bar, glass panels over the viewport
     The logo keeps its shape in both; only its colours change.
     Not wired to the game yet: the game's CSS still has its colours written
     out (~150 of them) — adopting a skin means turning those into
     variables first (docs/ui.md "Skin lab").
     Keys: 1 / 2 switch skins, C toggles the CRT effects (TERMINAL). -->
<style>
/* ================================================================ base */
:root{ --uiScale:1; }
html,body{ margin:0; height:100%; overflow:hidden; }
body{ background:#000; }
#stage{ position:absolute; left:50%; top:0; width:1536px; height:1024px; transform-origin:top center;
  transform:translateX(-50%) scale(var(--uiScale)); }
#stage > *{ position:absolute; box-sizing:border-box; }
.panel{ overflow:hidden; }
.panel > *{ box-sizing:border-box; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
#skinSwitch{ left:968px; top:88px; z-index:50; display:flex; gap:6px; font-family:"Oswald",sans-serif; }
#skinSwitch button{ padding:6px 14px; border-radius:6px; font-size:14px; letter-spacing:.5px; }
canvas#view{ display:block; }

/* layout (design px) — mirrors the game's HUD */
#logo{ left:8px; top:8px; width:380px; height:56px; }
#stats{ left:404px; top:8px; width:720px; height:56px; }
#clock{ right:8px; top:8px; width:388px; height:56px; }
#nav{ left:8px; top:76px; width:232px; height:222px; }
#fleet{ left:8px; top:306px; width:232px; height:292px; }
#unit{ left:8px; top:606px; width:232px; height:410px; }
#viewWrap{ left:248px; top:76px; width:1040px; height:940px; }
#info{ right:8px; top:76px; width:232px; height:300px; }
#log{ right:8px; top:384px; width:232px; height:316px; }
#mini{ right:8px; top:708px; width:232px; height:308px; }

#viewWrap canvas{ position:absolute; inset:0; width:100%; height:100%; }
#camToggle{ position:absolute; left:50%; top:12px; transform:translateX(-50%); display:flex; gap:6px; z-index:2; }
#cmd{ position:absolute; left:12px; bottom:12px; width:560px; height:124px; z-index:2; }
#cmdTabs{ display:flex; gap:4px; }
#cmdBtns{ display:flex; gap:6px; margin-top:8px; }
#cmdBtns button{ flex:1; height:70px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
#cmdBtns svg{ width:26px; height:26px; }

.logoSvg{ width:52px; height:48px; }
.statRow{ display:flex; height:100%; align-items:center; }
.stat{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 14px; }
.navItem{ display:flex; align-items:center; gap:8px; height:28px; padding:0 10px; }
.fleetCard{ display:flex; align-items:center; gap:10px; height:48px; padding:0 10px; }
.bar{ height:8px; position:relative; flex:1; }
.bar i{ position:absolute; left:0; top:0; bottom:0; }
.row{ display:flex; justify-content:space-between; gap:8px; }
.logLine{ display:flex; gap:8px; }
#miniCanvas{ display:block; }

/* ============================================================ TERMINAL */
body[data-skin="term"]{ background:#010502; }
[data-skin="term"] #stage{ font-family:"IBM Plex Mono",monospace; color:#39ff7a; }
[data-skin="term"] .panel{ overflow:visible; border:1px solid #1f9b48; background:rgba(2,18,7,.82); box-shadow:0 0 12px rgba(57,255,122,.12), inset 0 0 18px rgba(57,255,122,.06); }
[data-skin="term"] .panel .hd{ position:absolute; left:10px; top:-1px; transform:translateY(-50%); padding:0 6px; background:#010502;
  font-size:13px; letter-spacing:1px; color:#9dffbe; text-shadow:0 0 6px rgba(57,255,122,.8); }
[data-skin="term"] .panel .hd::before{ content:"┤ "; color:#1f9b48; }
[data-skin="term"] .panel .hd::after{ content:" ├"; color:#1f9b48; }
[data-skin="term"] .panel .body{ position:absolute; inset:16px 10px 10px 10px; }
[data-skin="term"] .glow, [data-skin="term"] .stat b, [data-skin="term"] .val{ text-shadow:0 0 5px rgba(57,255,122,.75), 0 0 14px rgba(57,255,122,.25); }
[data-skin="term"] #logo{ display:flex; align-items:center; gap:10px; padding-left:8px; }
[data-skin="term"] #logo .title{ font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:23px; letter-spacing:2px; white-space:nowrap; }
[data-skin="term"] #logo .title::after{ content:"█"; margin-left:4px; animation:blink 1s steps(1) infinite; }
[data-skin="term"] #logo .ver{ font-size:11px; color:#1f9b48; align-self:flex-end; margin-bottom:10px; }
[data-skin="term"] .stat{ border-left:1px dashed #1f7a3c; }
[data-skin="term"] .stat:first-child{ border-left:0; }
[data-skin="term"] .stat span{ font-size:11px; color:#1f9b48; text-transform:uppercase; letter-spacing:1px; }
[data-skin="term"] .stat b{ font-weight:500; font-size:20px; }
[data-skin="term"] #clock .body{ display:flex; align-items:center; justify-content:space-between; inset:6px 12px; }
[data-skin="term"] .tBtn{ border:1px solid #1f9b48; padding:3px 8px; font-size:13px; }
[data-skin="term"] .tBtn:hover, [data-skin="term"] .tBtn.on{ background:#39ff7a; color:#010502; text-shadow:none; }
[data-skin="term"] .navItem{ font-size:14px; letter-spacing:1px; }
[data-skin="term"] .navItem::before{ content:"  "; white-space:pre; }
[data-skin="term"] .navItem:hover, [data-skin="term"] .navItem.on{ background:#39ff7a; color:#010502; }
[data-skin="term"] .navItem.on::before, [data-skin="term"] .navItem:hover::before{ content:"> "; }
[data-skin="term"] .navItem.dim{ color:#1f7a3c; }
[data-skin="term"] .fleetCard{ border-bottom:1px dashed #164f27; font-size:13px; }
[data-skin="term"] .fleetCard .ico{ width:24px; text-align:center; }
[data-skin="term"] .fleetCard small{ display:block; color:#1f9b48; font-size:11px; }
[data-skin="term"] .fleetCard.on{ background:rgba(57,255,122,.12); outline:1px solid #39ff7a; }
/* segmented bars, like an LED/character display */
[data-skin="term"] .seg{ flex:1; height:10px; margin:0 8px; position:relative; align-self:center;
  background:repeating-linear-gradient(90deg, rgba(31,155,72,.35) 0 7px, transparent 7px 9px); }
[data-skin="term"] .seg i{ position:absolute; left:0; top:0; bottom:0;
  background:repeating-linear-gradient(90deg, #39ff7a 0 7px, transparent 7px 9px); filter:drop-shadow(0 0 4px rgba(57,255,122,.8)); }
[data-skin="term"] .row{ font-size:13px; line-height:21px; }
[data-skin="term"] .row span{ color:#1f9b48; }
[data-skin="term"] .uBtns{ display:flex; gap:6px; }
[data-skin="term"] .uBtns button{ flex:1; height:34px; border:1px solid #1f9b48; font-size:12px; }
[data-skin="term"] .uBtns button:hover{ background:#39ff7a; color:#010502; }
[data-skin="term"] .logLine{ font-size:12px; line-height:17px; margin-bottom:5px; }
[data-skin="term"] .logLine .t{ color:#1f9b48; }
[data-skin="term"] .logLine.alert{ color:#b6ffcc; animation:pulse 1.4s ease-in-out infinite; }
[data-skin="term"] #camToggle button{ border:1px solid #1f9b48; padding:4px 16px; font-size:13px; background:rgba(1,5,2,.85); }
[data-skin="term"] #camToggle button.on{ background:#39ff7a; color:#010502; }
[data-skin="term"] #cmd{ border:1px solid #1f9b48; background:rgba(1,8,3,.85); padding:8px; }
[data-skin="term"] #cmdTabs button{ font-size:12px; padding:3px 10px; border:1px solid #164f27; color:#1f9b48; }
[data-skin="term"] #cmdTabs button.on{ color:#39ff7a; border-color:#39ff7a; }
[data-skin="term"] #cmdBtns button{ border:1px solid #1f9b48; font-size:11px; }
[data-skin="term"] #cmdBtns button:hover{ background:#39ff7a; color:#010502; }
[data-skin="term"] #cmdBtns svg *{ stroke:currentColor !important; fill:none !important; }
[data-skin="term"] .syn{ display:none !important; }
/* the CRT itself: scanlines, a slow roll bar, curvature vignette, flicker */
#crt{ position:fixed; inset:0; pointer-events:none; z-index:40; display:none; }
[data-skin="term"][data-crt="on"] #crt{ display:block; }
#crt::before{ content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, transparent 1px 3px); mix-blend-mode:multiply; }
#crt::after{ content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.55) 100%),
             linear-gradient(to bottom, transparent 0%, rgba(57,255,122,.045) 48%, transparent 56%);
  background-size:100% 100%, 100% 300%; animation:roll 7s linear infinite; }
[data-skin="term"][data-crt="on"] #stage{ animation:flicker 5s infinite; filter:contrast(1.05) brightness(1.05); }
@keyframes blink{ 50%{ opacity:0; } }
@keyframes pulse{ 50%{ opacity:.45; } }
@keyframes roll{ from{ background-position:0 0, 0 -100%; } to{ background-position:0 0, 0 200%; } }
@keyframes flicker{ 0%,100%{ opacity:1; } 47%{ opacity:1; } 48%{ opacity:.93; } 49%{ opacity:1; } 83%{ opacity:.97; } }

/* ============================================================== SYNTAX */
/* A made-up editor palette: keyword pink, function cyan, string green,
   number orange, type violet, comment slate. */
body[data-skin="syn"]{ background:#0d0e17; }
[data-skin="syn"] #stage{ font-family:"Roboto Condensed",sans-serif; color:#e6e8f2;
  --kw:#ff6ac1; --fn:#5ee7ff; --str:#7ef29a; --num:#ffb45c; --type:#b58cff; --com:#6c7399; --bg:#161826; --bg2:#1d2033; --line:#2a2e48; }
[data-skin="syn"] .panel{ background:rgba(22,24,38,.86); border-radius:10px; border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.35); backdrop-filter:blur(10px); }
[data-skin="syn"] .panel .hd{ position:absolute; left:0; right:0; top:0; height:30px; display:flex; align-items:flex-end; gap:2px; padding:0 8px;
  background:var(--bg2); border-bottom:1px solid var(--line); font-family:"IBM Plex Mono",monospace; font-size:12px; }
[data-skin="syn"] .panel .hd .tab{ padding:5px 10px; border-radius:7px 7px 0 0; color:var(--com); }
[data-skin="syn"] .panel .hd .tab.on{ background:var(--bg); color:#e6e8f2; box-shadow:inset 0 2px 0 var(--accent, var(--fn)); }
[data-skin="syn"] .panel .body{ position:absolute; inset:38px 10px 10px 10px; }
[data-skin="syn"] .term{ display:none !important; }
[data-skin="syn"] .code{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; }
[data-skin="syn"] .kw{ color:var(--kw); } [data-skin="syn"] .fn{ color:var(--fn); } [data-skin="syn"] .str{ color:var(--str); }
[data-skin="syn"] .num{ color:var(--num); } [data-skin="syn"] .ty{ color:var(--type); } [data-skin="syn"] .com{ color:var(--com); }
/* the focused panel: an animated gradient rim */
[data-skin="syn"] .panel.focus{ border-color:transparent; }
[data-skin="syn"] .panel.focus::before{ content:""; position:absolute; inset:-1px; border-radius:10px; padding:1px; pointer-events:none;
  background:conic-gradient(from var(--ang,0deg), var(--kw), var(--num), var(--str), var(--fn), var(--type), var(--kw));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
  animation:spin 6s linear infinite; }
@property --ang{ syntax:"<angle>"; inherits:false; initial-value:0deg; }
@keyframes spin{ to{ --ang:360deg; } }
[data-skin="syn"] #logo{ display:flex; align-items:center; gap:12px; padding-left:10px; background:linear-gradient(90deg, rgba(29,32,51,.95), rgba(29,32,51,0)); border-radius:10px; }
[data-skin="syn"] #logo .title{ font-family:"Antonio",sans-serif; font-weight:700; font-size:32px; letter-spacing:1px;
  background:linear-gradient(90deg, var(--kw), var(--num) 35%, var(--str) 65%, var(--fn)); -webkit-background-clip:text; background-clip:text; color:transparent;
  background-size:200% 100%; animation:shift 8s ease-in-out infinite alternate; }
[data-skin="syn"] #logo .ver{ font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--com); align-self:flex-end; margin-bottom:12px; }
@keyframes shift{ to{ background-position:100% 0; } }
[data-skin="syn"] #stats{ background:var(--bg2); border:1px solid var(--line); border-radius:10px; }
[data-skin="syn"] .stat{ border-left:1px solid var(--line); font-family:"IBM Plex Mono",monospace; }
[data-skin="syn"] .stat:first-child{ border-left:0; }
[data-skin="syn"] .stat span{ font-size:11px; color:var(--com); }
[data-skin="syn"] .stat b{ font-weight:500; font-size:19px; }
[data-skin="syn"] #clock{ background:var(--bg2); border:1px solid var(--line); border-radius:10px; }
[data-skin="syn"] #clock .body{ position:absolute; inset:0 14px; display:flex; align-items:center; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:13px; }
[data-skin="syn"] .tBtn{ padding:4px 10px; border-radius:6px; background:var(--bg); border:1px solid var(--line); }
[data-skin="syn"] .tBtn.on{ border-color:var(--str); color:var(--str); box-shadow:0 0 12px rgba(126,242,154,.25); }
[data-skin="syn"] .navItem{ font-family:"IBM Plex Mono",monospace; font-size:13px; border-radius:6px; height:25px; }
[data-skin="syn"] .fleetCard small, [data-skin="syn"] .fleetCard > div{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
[data-skin="syn"] .fleetCard > div{ min-width:0; }
[data-skin="syn"] .navItem .ext{ color:var(--com); }
[data-skin="syn"] .navItem:hover{ background:var(--bg2); }
[data-skin="syn"] .navItem.on{ background:linear-gradient(90deg, rgba(94,231,255,.16), transparent); box-shadow:inset 2px 0 0 var(--fn); }
[data-skin="syn"] .navItem.dim{ opacity:.45; }
[data-skin="syn"] .navItem .dot{ width:8px; height:8px; border-radius:50%; }
[data-skin="syn"] .gutter{ width:22px; text-align:right; color:#3d4266; font-family:"IBM Plex Mono",monospace; font-size:11px; }
[data-skin="syn"] .fleetCard{ border-radius:7px; font-size:13px; }
[data-skin="syn"] .fleetCard:hover{ background:var(--bg2); }
[data-skin="syn"] .fleetCard.on{ background:rgba(181,140,255,.14); }
[data-skin="syn"] .fleetCard small{ display:block; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--com); }
[data-skin="syn"] .bar{ background:#262a44; border-radius:4px; overflow:hidden; }
[data-skin="syn"] .bar i{ border-radius:4px; background:linear-gradient(90deg, var(--fn), var(--str)); }
[data-skin="syn"] .bar.hot i{ background:linear-gradient(90deg, var(--num), var(--kw)); }
[data-skin="syn"] .row{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; line-height:21px; }
[data-skin="syn"] .uBtns{ display:flex; gap:6px; }
[data-skin="syn"] .uBtns button{ flex:1; height:34px; border-radius:7px; background:var(--bg2); border:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace; font-size:12px; transition:transform .12s, box-shadow .12s; }
[data-skin="syn"] .uBtns button:hover{ transform:translateY(-1px); box-shadow:0 4px 14px rgba(94,231,255,.25); border-color:var(--fn); }
[data-skin="syn"] .logLine{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; line-height:16px; margin-bottom:6px; }
[data-skin="syn"] .logLine .t{ color:var(--com); }
[data-skin="syn"] #camToggle{ background:rgba(22,24,38,.8); border:1px solid var(--line); border-radius:9px; padding:3px; backdrop-filter:blur(8px); gap:2px; }
[data-skin="syn"] #camToggle button{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; padding:5px 14px; border-radius:6px; color:var(--com); }
[data-skin="syn"] #camToggle button.on{ background:var(--bg2); color:var(--fn); }
[data-skin="syn"] #cmd{ background:rgba(22,24,38,.72); border:1px solid var(--line); border-radius:12px; padding:8px; backdrop-filter:blur(10px); }
[data-skin="syn"] #cmdTabs button{ font-family:"IBM Plex Mono",monospace; font-size:12px; padding:4px 10px; border-radius:6px; color:var(--com); }
[data-skin="syn"] #cmdTabs button.on{ color:#e6e8f2; background:var(--bg2); box-shadow:inset 0 -2px 0 var(--kw); }
[data-skin="syn"] #cmdBtns button{ border-radius:9px; background:var(--bg2); border:1px solid var(--line); font-family:"IBM Plex Mono",monospace; font-size:11.5px; }
[data-skin="syn"] #cmdBtns button:hover{ border-color:var(--kw); box-shadow:0 0 16px rgba(255,106,193,.25); }
[data-skin="syn"] #statusBar{ left:248px; top:1018px; width:1040px; height:0; }
[data-skin="syn"] #viewWrap{ border-radius:12px; overflow:hidden; border:1px solid var(--line); }
#statusBar{ display:none; }
[data-skin="syn"] #statusBar{ display:block; }
</style>
</head>
<body data-skin="term" data-crt="on">
<script src="../js/labkit/menubar.js"></script>
<div id="crt"></div>

<div id="stage">
  <!-- logo: same shape, the skin only recolours it -->
  <div id="logo">
    <svg class="logoSvg" viewBox="0 0 52 48" aria-hidden="true">
      <defs>
        <linearGradient id="lgA" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" class="lgA0"/><stop offset="1" class="lgA1"/></linearGradient>
        <linearGradient id="lgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="lgB0"/><stop offset="1" class="lgB1"/></linearGradient>
        <filter id="phosphor"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g id="logoG">
        <path d="M16 8 L3 24 L16 40 M36 8 L49 24 L36 40" fill="none" stroke="url(#lgA)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="26" cy="15" r="3.6" fill="url(#lgB)"/><circle cx="20" cy="30" r="3.6" fill="url(#lgB)"/><circle cx="32" cy="30" r="3.6" fill="url(#lgB)"/>
      </g>
    </svg>
    <div class="title glow">SWARM PROTOCOL</div>
    <div class="ver">v2.19</div>
  </div>

  <div id="stats" class="panel"><div class="statRow">
    <div class="stat"><span>points</span><b class="val" id="sPoints">12,480</b></div>
    <div class="stat"><span>units</span><b class="val">7 + 1</b></div>
    <div class="stat"><span>eaten</span><b class="val">14</b></div>
    <div class="stat"><span>online</span><b class="val">3</b></div>
  </div></div>

  <div id="clock" class="panel"><div class="body">
    <span class="glow">CYCLE <b class="val" id="cyc">6.5</b> <span class="com syn">//</span> <span id="clk">13:42</span></span>
    <span style="display:flex;gap:6px">
      <button class="tBtn" title="Pause">❚❚</button><button class="tBtn on" title="Play">▶</button><button class="tBtn" title="Fast">▶▶</button>
    </span>
  </div></div>

  <!-- navigation -->
  <div id="nav" class="panel">
    <div class="hd"><span class="term">NAV</span><span class="tab on syn" style="--accent:var(--fn)">explorer</span></div>
    <div class="body" id="navList"></div>
  </div>

  <!-- fleet list -->
  <div id="fleet" class="panel">
    <div class="hd"><span class="term">FLEET</span><span class="tab on syn" style="--accent:var(--type)">fleet.swarm</span><span class="tab syn">drone.ds</span></div>
    <div class="body" id="fleetList"></div>
  </div>

  <!-- selected unit -->
  <div id="unit" class="panel focus">
    <div class="hd"><span class="term">UNIT</span><span class="tab on syn" style="--accent:var(--kw)">ship_2.swarm</span></div>
    <div class="body">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <div><div class="glow" style="font-size:16px">Ship 2</div><div class="com" style="font-size:12px;opacity:.8">SW-01 SWARMER · program</div></div>
      </div>
      <canvas id="unitThumb" width="420" height="140" style="width:210px;height:70px;margin:8px 0 6px"></canvas>
      <div id="unitBars"></div>
      <div style="height:1px;margin:8px 0" class="sep"></div>
      <div id="unitRows"></div>
      <div class="uBtns" style="margin-top:10px">
        <button title="View"><span class="term">[VIEW]</span><span class="syn fn">view()</span></button>
        <button title="Run the program"><span class="term">[RUN]</span><span class="syn str">run()</span></button>
        <button title="Stop"><span class="term">[STOP]</span><span class="syn kw">stop()</span></button>
        <button title="Edit"><span class="term">[EDIT]</span><span class="syn num">edit()</span></button>
      </div>
    </div>
  </div>

  <!-- the viewport: a live sketch of the solar system -->
  <div id="viewWrap">
    <canvas id="view" width="2080" height="1880"></canvas>
    <div id="camToggle"><button class="on"><span class="term">BASE</span><span class="syn">base</span></button><button><span class="term">SYSTEM</span><span class="syn">system</span></button></div>
    <div id="cmd">
      <div id="cmdTabs"><button class="on"><span class="term">TACTICAL</span><span class="syn">tactics.ts</span></button><button><span class="term">MOVE</span><span class="syn">move.ts</span></button><button><span class="term">BUILD</span><span class="syn">build.ts</span></button><button><span class="term">SPECIAL</span><span class="syn">special.ts</span></button></div>
      <div id="cmdBtns"></div>
    </div>
  </div>

  <!-- planet info -->
  <div id="info" class="panel">
    <div class="hd"><span class="term">OBJECT</span><span class="tab on syn" style="--accent:var(--str)">terra_1.body</span></div>
    <div class="body">
      <canvas id="infoThumb" width="160" height="160" style="width:80px;height:80px;float:left;margin:0 10px 6px 0"></canvas>
      <div class="glow" style="font-size:16px;margin-top:6px">TERRA-1</div>
      <div class="com" style="font-size:12px;opacity:.85">neutral planet · ~27 pts</div>
      <div style="clear:both"></div>
      <div id="infoRows" style="margin-top:4px"></div>
      <div class="uBtns" style="margin-top:12px">
        <button title="Set a waypoint"><span class="term">[WAYPOINT]</span><span class="syn fn">waypoint()</span></button>
        <button title="View"><span class="term">[VIEW]</span><span class="syn str">view()</span></button>
      </div>
    </div>
  </div>

  <!-- event log -->
  <div id="log" class="panel">
    <div class="hd"><span class="term">LOG</span><span class="tab on syn" style="--accent:var(--num)">console</span><span class="tab syn">problems <span class="kw">1</span></span></div>
    <div class="body" id="logList"></div>
  </div>

  <!-- minimap -->
  <div id="mini" class="panel">
    <div class="hd"><span class="term">RADAR</span><span class="tab on syn" style="--accent:var(--fn)">minimap</span></div>
    <div class="body"><canvas id="miniCanvas" width="424" height="508" style="width:212px;height:254px"></canvas></div>
  </div>

  <!-- SYNTAX: an editor status bar under the viewport -->
  <div id="statusBar"></div>
  <div id="skinSwitch">
    <button data-s="term">1 · TERMINAL</button>
    <button data-s="syn">2 · SYNTAX</button>
    <button id="crtBtn" title="CRT effects (key C)">CRT</button>
  </div>
</div>

<script src="../js/labs/skins.js"></script>
</body>
</html>
