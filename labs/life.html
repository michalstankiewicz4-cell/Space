<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swarm Protocol // Life lab</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/fonts.css">
<!-- Life forms (LifeKit, js/lifekit/): creatures built from blocks — a
     skeleton, swept bodies that bend at the joints, rigid heads, hands and
     feet — and moving in their medium (land now: walk, run, stand).
     The first one: a human. docs/life.md. -->
<link rel="stylesheet" href="../css/lab.css">
<style>
.hidden{ display:none !important; }
#view{ position:fixed; inset:0; width:100%; height:100%; display:block; }
#creTabs{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
#creTabs .tBtn{ height:28px; }
#blurb{ font-size:13px; color:#9fb1ff; margin:4px 0 6px; line-height:1.35; }
.fourBtns{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:6px; }
.twoBtns{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
.threeBtns{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px; }
.fourBtns .tBtn, .twoBtns .tBtn, .threeBtns .tBtn{ height:28px; font-size:12.5px; }
#faceSliders .sl span{ font-size:12.5px; }
.prow{ display:grid; grid-template-columns:96px 1fr; gap:8px; align-items:center; margin-top:5px; font-size:13.5px; color:#c7d0ff; }
.seedRow{ display:grid; grid-template-columns:96px 1fr 34px; gap:8px; align-items:center; margin-top:5px; font-size:13.5px; color:#c7d0ff; }
select.lab, input.lab{ height:28px; border:1.5px solid #3c55d8; border-radius:6px; background:#02061a; color:#e6ebff; font-family:var(--fontBody); font-size:13.5px; padding:0 6px; min-width:0; }
#fpsGraph{ height:40px; }
</style>
</head>
<body>
<script src="../js/labkit/menubar.js"></script>
<canvas id="view"></canvas>
<div id="hud">
  <div id="hudTop">
    <div class="mat blue" id="hudBracket"></div>
    <svg id="hudLogo" viewBox="0 0 52 48" aria-hidden="true">
      <defs>
        <linearGradient id="gLogoGold" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ffe0a0"/><stop offset=".5" stop-color="#f8bb56"/><stop offset="1" stop-color="#cf8a35"/></linearGradient>
        <linearGradient id="gLogoBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8c5ff"/><stop offset="1" stop-color="#6d82f5"/></linearGradient>
      </defs>
      <path d="M16 8 L3 24 L16 40 M36 8 L49 24 L36 40" fill="none" stroke="url(#gLogoGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="26" cy="15" r="3.6" fill="url(#gLogoBlue)"/><circle cx="20" cy="30" r="3.6" fill="url(#gLogoBlue)"/><circle cx="32" cy="30" r="3.6" fill="url(#gLogoBlue)"/>
    </svg>
    <div id="hudTitle"></div>
    <div id="hudSub">SWARM PROTOCOL // LIFE LAB</div>
  </div>
  <div class="mat gold" id="hudBar"></div>
  <div class="hudPanel">
    <div class="mat blue side"></div>
    <div class="secHd first">LIFE FORMS</div>
    <div id="creTabs"></div>
    <div id="blurb"></div>
    <div class="secHd">MOVEMENT · LAND</div>
    <div class="fourBtns" id="gaits">
      <button class="tBtn on" data-g="idle">STAND</button>
      <button class="tBtn" data-g="walk">WALK</button>
      <button class="tBtn" data-g="run">RUN</button>
      <button class="tBtn" data-g="tpose">T-POSE</button>
    </div>
    <label class="sl"><span>Speed</span><b id="spVal">–</b></label>
    <input type="range" id="spSlider" min="0.5" max="6" step="0.1" value="1.4">
    <label class="sl"><span>Time (slow motion)</span><b id="tsVal">100%</b></label>
    <input type="range" id="tsSlider" min="0.05" max="1.5" step="0.05" value="1">
    <div class="twoBtns">
      <button class="tBtn on" id="pInPlace" title="The ground moves under it: the feet against the grid">IN PLACE</button>
      <button class="tBtn" id="pCircle" title="Around a circle; the camera follows">AROUND</button>
    </div>
    <div class="secHd">LAYERS (ON TOP OF ANY GAIT)</div>
    <div id="layerSliders"></div>
    <div class="secHd">VIEW</div>
    <div class="threeBtns">
      <button class="tBtn" id="btnBones">SKELETON</button>
      <button class="tBtn" id="btnWire">WIREFRAME</button>
      <button class="tBtn on" id="btnScale">SCALE BAR</button>
    </div>
    <div id="hint">Drag: turn the camera · Right-drag: pan · Scroll: zoom</div>
  </div>
</div>
<div id="opt">
  <div class="hudPanel">
    <div class="mat lilac side"></div>
    <div class="secHd first">BODY</div>
    <div id="params"></div>
    <div class="secHd">FACE</div>
    <div class="threeBtns">
      <button class="tBtn on" id="btnLively" title="Blinks, glances, breathing">LIVELY</button>
      <button class="tBtn" id="btnTalk" title="The jaw and the lips as if speaking">TALK</button>
      <button class="tBtn" id="btnClose" title="The camera to the face">CLOSE-UP</button>
    </div>
    <div class="threeBtns" id="facePresets"></div>
    <div id="faceSliders"></div>
    <div class="secHd">MODEL</div>
    <div id="stats"></div>
    <div class="secHd">PERFORMANCE</div>
    <div class="row"><span>Frames per second</span><b id="statFps">–</b></div>
    <div class="row"><span>Frame time</span><b id="statMs">–</b></div>
    <div class="row"><span>CPU per frame</span><b id="statCpu">–</b></div>
    <div class="row"><span>Triangles drawn / frame</span><b id="statTris">–</b></div>
    <div class="row"><span>Draw calls / frame</span><b id="statCalls">–</b></div>
    <canvas id="fpsGraph" width="270" height="40"></canvas>
  </div>
</div>
<script src="../vendor/three-r128.min.js"></script>
<script src="../vendor/three-r128-examples/OrbitControls.js"></script>
<script src="../js/labkit/labkit.js"></script>
<script src="../js/shipkit/shipkit.js"></script>
<script src="../js/lifekit/lifekit.js"></script>
<script src="../js/lifekit/move/walk.js"></script>
<script src="../js/lifekit/parts/face.js"></script>
<script src="../js/lifekit/data/bust-head.js"></script>
<script src="../js/lifekit/data/human-head.js"></script>
<script src="../js/lifekit/creatures/human.js"></script>
<script src="../js/labs/life.js"></script>
</body>
</html>
