<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grain texture generator</title>
<!-- Dev tool, not part of the game: regenerates css/ui/grain.png, the
     tileable grain the UI kit's .mat surfaces blend in (css/ui/kit.css).
     Deterministic (fixed seed), so the output only changes if the
     parameters below do. Open from disk, click "Download", replace the
     file. -->
<style>
  body{ background:#111; color:#ddd; font-family:sans-serif; padding:20px; }
  #preview{ width:480px; height:320px; background-color:#5f77f7; background-blend-mode:soft-light; margin:12px 0; }
</style>
</head>
<body>
<div>Grain texture (160x160, seed 7) — preview tiled over the kit's blue:</div>
<div id="preview"></div>
<a id="download" download="grain.png">Download grain.png</a>
<script>
// Tileable grayscale value noise (vertical streaks + blotches) plus fine
// grain, applied with soft-light over every .mat surface.
function makeGrainTexture(size = 160, seed = 7){
  let st = seed >>> 0;
  const rand = () => { st = (st * 1664525 + 1013904223) >>> 0; return st / 4294967296; };
  function valueNoise(cellsX, cellsY){
    const g = [];
    for(let i = 0; i < cellsX * cellsY; i++) g.push(rand());
    const at = (x, y) => g[(y % cellsY) * cellsX + (x % cellsX)];
    return (px, py) => {
      const fx = (px / size) * cellsX, fy = (py / size) * cellsY;
      const x0 = Math.floor(fx), y0 = Math.floor(fy);
      let tx = fx - x0, ty = fy - y0;
      tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
      const a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
      return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
    };
  }
  const streaks = valueNoise(4, 20), blotches = valueNoise(5, 5);
  const cv = document.createElement("canvas");
  cv.width = cv.height = size;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(size, size);
  for(let y = 0; y < size; y++){
    for(let x = 0; x < size; x++){
      const n = (streaks(x, y) - 0.5) * 0.8 + (blotches(x, y) - 0.5) * 0.7 + (rand() - 0.5) * 0.22;
      const v = Math.max(0, Math.min(255, 128 + n * 60));
      const i = (y * size + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv.toDataURL("image/png");
}

const url = makeGrainTexture();
document.getElementById("preview").style.backgroundImage = `url(${url})`;
document.getElementById("download").href = url;
</script>
</body>
</html>
