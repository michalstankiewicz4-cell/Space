<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomyje Studio // logo</title>
<link rel="icon" href="../favicon.svg">
<!-- The studio logo, drawn in a 2D canvas: no image files. Techniques: a
     cylinder-shaded and brushed metal bucket (gradients, anisotropic
     strokes, blurred grime in multiply mode), goo as a union of circles with
     an inner glow, glossy bubbles and drips, an additive sparkle with lens
     rays, extruded lettering with an offscreen-masked gloss, a seeded
     starfield and film grain. Seeded RNG: every render is identical.
     ?bg=0 draws it on a transparent background. SAVE PNG downloads it. -->
<style>
  @font-face{ font-family:"Space Grotesk"; font-weight:400 700; src:url(../fonts/space-grotesk-var-latin-ext.woff2) format("woff2"); unicode-range:U+0100-024F; }
  @font-face{ font-family:"Space Grotesk"; font-weight:400 700; src:url(../fonts/space-grotesk-var-latin.woff2) format("woff2"); }
  html,body{ margin:0; background:#090b10; color:#c9ced8; font:14px "Space Grotesk", sans-serif; }
  body{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; }
  canvas{ width:min(1200px, 100%); height:auto; border-radius:6px;
    background:repeating-conic-gradient(#1a1d24 0 25%, #12141a 0 50%) 0 0/24px 24px; }
  .bar{ display:flex; gap:10px; }
  button,a{ background:#1d2230; color:#f8bb56; border:1px solid #3a4152; border-radius:6px;
    padding:6px 14px; font:inherit; cursor:pointer; text-decoration:none; }
</style>
</head>
<body>
<canvas id="logo"></canvas>
<div class="bar">
  <button id="save">SAVE PNG</button>
  <a id="toggleBg" href="?bg=0">TRANSPARENT</a>
</div>
<script>
"use strict";
const W = 1200, H = 980, S = 2;            // design size, render scale
const BG = new URLSearchParams(location.search).get("bg") !== "0";
const cv = document.getElementById("logo");
cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext("2d");
if(!BG){ document.getElementById("toggleBg").href = "?"; document.getElementById("toggleBg").textContent = "WITH BACKGROUND"; }

// Seeded random, so the stars, grime and grain are the same every time.
function rng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const lerp = (a, b, t) => a + (b - a) * t;
function grad(c, x0, y0, x1, y1, stops){
  const g = c.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(s => g.addColorStop(s[0], s[1]));
  return g;
}
function radial(c, x, y, r, stops, x0, y0, r0){
  const g = c.createRadialGradient(x0 ?? x, y0 ?? y, r0 || 0, x, y, r);
  stops.forEach(s => g.addColorStop(s[0], s[1]));
  return g;
}

// ---------- geometry ----------
const CX = 600;
const RIM = { y: 262, rx: 190, ry: 36 };
const BOT = { y: 532, rx: 150, ry: 26 };
function bucketAt(f){ return { y: lerp(RIM.y, BOT.y, f), rx: lerp(RIM.rx, BOT.rx, f), ry: lerp(RIM.ry, BOT.ry, f) }; }
function bodyPath(c){
  c.beginPath();
  c.moveTo(CX - RIM.rx, RIM.y);
  c.lineTo(CX - BOT.rx, BOT.y);
  c.ellipse(CX, BOT.y, BOT.rx, BOT.ry, 0, Math.PI, 0, true);
  c.lineTo(CX + RIM.rx, RIM.y);
  c.ellipse(CX, RIM.y, RIM.rx, RIM.ry, 0, 0, Math.PI, false);
  c.closePath();
}
const METAL = [[0, "#2b2f36"], [0.1, "#6f7782"], [0.27, "#e4e9ef"], [0.34, "#f7f9fb"], [0.42, "#bfc6cf"],
  [0.6, "#868e99"], [0.78, "#b3bac4"], [0.9, "#646b75"], [1, "#24272d"]];

// ---------- background ----------
function background(c){
  c.fillStyle = radial(c, CX, 420, 820, [[0, "#1c2130"], [0.55, "#11141c"], [1, "#07080c"]]);
  c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = "screen";
  [[CX, 400, 520, "rgba(110,200,50,0.13)"], [220, 180, 460, "rgba(80,95,230,0.11)"],
   [900, 110, 320, "rgba(248,187,86,0.09)"], [1050, 700, 380, "rgba(70,190,170,0.06)"]].forEach(n => {
    c.fillStyle = radial(c, n[0], n[1], n[2], [[0, n[3]], [1, "rgba(0,0,0,0)"]]);
    c.fillRect(0, 0, W, H);
  });
  const r = rng(7);
  for(let i = 0; i < 320; i++){
    const x = r() * W, y = r() * H, s = 0.35 + r() * r() * 1.6, a = 0.25 + r() * 0.6;
    const hue = r() < 0.2 ? "255,214,150" : r() < 0.3 ? "170,190,255" : "235,240,255";
    c.fillStyle = "rgba(" + hue + "," + a + ")";
    c.beginPath(); c.arc(x, y, s, 0, Math.PI * 2); c.fill();
    if(s > 1.5){
      c.fillStyle = radial(c, x, y, s * 6, [[0, "rgba(" + hue + ",0.35)"], [1, "rgba(0,0,0,0)"]]);
      c.fillRect(x - s * 6, y - s * 6, s * 12, s * 12);
    }
  }
  c.globalCompositeOperation = "source-over";
}

// ---------- floor: glow, contact shadow, puddle ----------
function floor(c){
  if(BG){
    c.fillStyle = radial(c, CX, BOT.y + 20, 360, [[0, "rgba(130,220,50,0.16)"], [1, "rgba(130,220,50,0)"]]);
    c.save(); c.scale(1, 0.32); c.fillRect(CX - 400, (BOT.y + 20) / 0.32 - 400, 800, 800); c.restore();
  }
  c.save(); c.translate(CX, BOT.y + 16); c.scale(1, 0.18);
  c.fillStyle = radial(c, 0, 0, 230, [[0, "rgba(0,0,0,0.75)"], [0.6, "rgba(0,0,0,0.35)"], [1, "rgba(0,0,0,0)"]]);
  c.fillRect(-240, -240, 480, 480); c.restore();

  // puddle: a union of ellipses, glossy
  const blobs = [[CX + 70, BOT.y + 30, 120, 16], [CX + 150, BOT.y + 36, 70, 12], [CX - 20, BOT.y + 34, 70, 10], [CX + 215, BOT.y + 40, 26, 6]];
  c.save();
  c.shadowColor = "rgba(140,255,60,0.5)"; c.shadowBlur = 24;
  c.beginPath(); blobs.forEach(b => { c.moveTo(b[0] + b[2], b[1]); c.ellipse(b[0], b[1], b[2], b[3], 0, 0, Math.PI * 2); });
  c.fillStyle = grad(c, 0, BOT.y + 18, 0, BOT.y + 52, [[0, "#9be038"], [0.6, "#5aa018"], [1, "#2e620b"]]);
  c.fill();
  c.restore();
  c.save(); c.clip();
  c.strokeStyle = "rgba(240,255,200,0.55)"; c.lineWidth = 2.2; c.lineCap = "round";
  c.beginPath(); c.moveTo(CX + 20, BOT.y + 24); c.quadraticCurveTo(CX + 90, BOT.y + 20, CX + 150, BOT.y + 27); c.stroke();
  c.restore();
}
function drop(c, x, y, r){
  c.save();
  c.beginPath(); c.moveTo(x, y - r * 2.6);
  c.bezierCurveTo(x + r * 0.4, y - r * 1.6, x + r, y - r * 0.8, x + r, y);
  c.arc(x, y, r, 0, Math.PI, false);
  c.bezierCurveTo(x - r, y - r * 0.8, x - r * 0.4, y - r * 1.6, x, y - r * 2.6);
  c.shadowColor = "rgba(140,255,60,0.6)"; c.shadowBlur = 10;
  c.fillStyle = radial(c, x, y, r * 1.6, [[0, "#d6ff7a"], [0.6, "#7cc423"], [1, "#3c7a10"]], x - r * 0.3, y - r * 0.4, 0);
  c.fill(); c.restore();
  c.fillStyle = "rgba(255,255,240,0.85)";
  c.beginPath(); c.ellipse(x - r * 0.35, y - r * 0.3, r * 0.22, r * 0.38, -0.3, 0, Math.PI * 2); c.fill();
}

// ---------- handle (behind the goo) ----------
function handle(c){
  const L = [CX - RIM.rx + 6, RIM.y + 30], R = [CX + RIM.rx - 6, RIM.y + 30];
  const path = () => { c.beginPath(); c.moveTo(L[0], L[1]); c.bezierCurveTo(CX - RIM.rx - 40, RIM.y - 330, CX + RIM.rx + 40, RIM.y - 330, R[0], R[1]); };
  c.save(); c.lineCap = "round";
  path(); c.strokeStyle = "rgba(0,0,0,0.55)"; c.lineWidth = 15; c.filter = "blur(3px)"; c.stroke(); c.filter = "none";
  path(); c.strokeStyle = "#1e2127"; c.lineWidth = 15; c.stroke();
  path(); c.strokeStyle = grad(c, 0, RIM.y - 250, 0, RIM.y + 30, [[0, "#f3f6f9"], [0.35, "#a9b0ba"], [1, "#4a5059"]]); c.lineWidth = 11; c.stroke();
  c.translate(-1.5, -2.5);
  path(); c.strokeStyle = "rgba(255,255,255,0.55)"; c.lineWidth = 2; c.stroke();
  c.restore();
}

// ---------- the bucket body ----------
function body(c){
  // drop shadow on the floor side
  c.save();
  bodyPath(c);
  c.fillStyle = grad(c, CX - RIM.rx, 0, CX + RIM.rx, 0, METAL);
  c.fill();
  c.clip();

  // brushed metal: thin strokes along the taper
  const r = rng(21);
  for(let i = 0; i < 520; i++){
    const t = r() * 2 - 1;
    c.strokeStyle = r() < 0.5 ? "rgba(255,255,255," + (0.02 + r() * 0.07) + ")" : "rgba(0,0,0," + (0.03 + r() * 0.08) + ")";
    c.lineWidth = 0.4 + r() * 1.1;
    c.beginPath(); c.moveTo(CX + t * RIM.rx, RIM.y - 40); c.lineTo(CX + t * BOT.rx, BOT.y + 30); c.stroke();
  }
  // vertical seam
  c.strokeStyle = "rgba(0,0,0,0.25)"; c.lineWidth = 2;
  c.beginPath(); c.moveTo(CX + 0.62 * RIM.rx, RIM.y); c.lineTo(CX + 0.62 * BOT.rx, BOT.y + 20); c.stroke();
  c.strokeStyle = "rgba(255,255,255,0.18)"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(CX + 0.62 * RIM.rx + 2, RIM.y); c.lineTo(CX + 0.62 * BOT.rx + 2, BOT.y + 20); c.stroke();

  // grime, blurred, multiplied
  c.globalCompositeOperation = "multiply";
  c.filter = "blur(7px)";
  for(let i = 0; i < 16; i++){
    const f = 0.25 + r() * 0.8, b = bucketAt(Math.min(f, 1)), x = CX + (r() * 2 - 1) * b.rx * 0.95;
    c.fillStyle = "rgba(" + (110 + r() * 40 | 0) + "," + (95 + r() * 25 | 0) + "," + (70 + r() * 20 | 0) + "," + (0.18 + r() * 0.22) + ")";
    c.beginPath(); c.ellipse(x, b.y, 10 + r() * 34, 4 + r() * 10, 0, 0, Math.PI * 2); c.fill();
  }
  c.filter = "none";
  c.globalCompositeOperation = "source-over";

  // ambient occlusion under the lip, darker bottom, green bounce light
  c.fillStyle = grad(c, 0, RIM.y, 0, RIM.y + 70, [[0, "rgba(0,0,0,0.55)"], [1, "rgba(0,0,0,0)"]]);
  c.fillRect(0, RIM.y - 40, W, 120);
  c.fillStyle = grad(c, 0, BOT.y - 110, 0, BOT.y + 30, [[0, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,0.45)"]]);
  c.fillRect(0, BOT.y - 110, W, 160);
  c.globalCompositeOperation = "screen";
  c.fillStyle = radial(c, CX, RIM.y, 260, [[0, "rgba(150,235,60,0.22)"], [1, "rgba(150,235,60,0)"]]);
  c.fillRect(0, 0, W, H);
  c.globalCompositeOperation = "source-over";

  // ribs, following the curvature
  [0.36, 0.7].forEach(f => {
    const b = bucketAt(f);
    const arc = (dy, lw, style) => { c.beginPath(); c.ellipse(CX, b.y + dy, b.rx + 2, b.ry, 0, 0, Math.PI); c.lineWidth = lw; c.strokeStyle = style; c.stroke(); };
    arc(6, 9, "rgba(0,0,0,0.35)");
    arc(0, 9, grad(c, CX - b.rx, 0, CX + b.rx, 0, METAL));
    arc(-3.5, 1.6, "rgba(255,255,255,0.65)");
    arc(4, 1.6, "rgba(0,0,0,0.5)");
  });
  c.restore();

  // bottom edge
  c.save(); c.lineCap = "round";
  c.beginPath(); c.ellipse(CX, BOT.y, BOT.rx, BOT.ry, 0, 0.05, Math.PI - 0.05);
  c.strokeStyle = "#1c1f24"; c.lineWidth = 4; c.stroke();
  c.beginPath(); c.ellipse(CX, BOT.y - 3, BOT.rx - 1, BOT.ry, 0, 0.2, Math.PI - 0.2);
  c.strokeStyle = "rgba(255,255,255,0.22)"; c.lineWidth = 1.2; c.stroke();
  c.restore();

  // handle ears + rivets
  [-1, 1].forEach(s => {
    const x = CX + s * (RIM.rx - 14), y = RIM.y + 32;
    c.save();
    c.beginPath(); c.ellipse(x, y, 13, 18, s * 0.08, 0, Math.PI * 2);
    c.shadowColor = "rgba(0,0,0,0.6)"; c.shadowBlur = 6; c.shadowOffsetY = 2;
    c.fillStyle = grad(c, x - 13, y - 18, x + 13, y + 18, [[0, "#eef2f6"], [0.5, "#9aa2ad"], [1, "#4b515a"]]);
    c.fill(); c.restore();
    c.fillStyle = radial(c, x, y + 4, 5, [[0, "#ffffff"], [0.4, "#b7bec8"], [1, "#3b4048"]], x - 1.5, y + 2.5, 0);
    c.beginPath(); c.arc(x, y + 4, 4.5, 0, Math.PI * 2); c.fill();
  });
}

// ---------- rim (rolled lip) ----------
function rimBack(c){
  c.save(); c.lineCap = "round";
  c.beginPath(); c.ellipse(CX, RIM.y, RIM.rx, RIM.ry, 0, Math.PI, Math.PI * 2);
  c.strokeStyle = "#3a3f47"; c.lineWidth = 14; c.stroke();
  c.beginPath(); c.ellipse(CX, RIM.y - 3, RIM.rx, RIM.ry, 0, Math.PI * 1.1, Math.PI * 1.9);
  c.strokeStyle = "rgba(255,255,255,0.35)"; c.lineWidth = 2; c.stroke();
  c.restore();
}
function rimFront(c){
  c.save(); c.lineCap = "round";
  const arc = (dy, lw, style) => { c.beginPath(); c.ellipse(CX, RIM.y + dy, RIM.rx, RIM.ry, 0, 0, Math.PI); c.lineWidth = lw; c.strokeStyle = style; c.stroke(); };
  arc(8, 14, "rgba(0,0,0,0.45)");
  arc(0, 15, "#1f2228");
  arc(0, 12, grad(c, CX - RIM.rx, 0, CX + RIM.rx, 0, METAL));
  arc(-3.5, 2.6, "rgba(255,255,255,0.8)");
  arc(5, 1.5, "rgba(0,0,0,0.55)");
  c.restore();
}

// ---------- goo ----------
const MOUND = [[CX - 128, RIM.y - 14, 60], [CX - 62, RIM.y - 52, 78], [CX + 26, RIM.y - 66, 84], [CX + 108, RIM.y - 34, 68],
  [CX + 160, RIM.y - 6, 40], [CX - 168, RIM.y - 2, 36]];
// One outline: the highest of the rim ellipse and the circles at every x,
// so strokes and glows follow the outer edge only.
function moundTop(x){
  const rx = RIM.rx - 3, dx = x - CX;
  let y = RIM.y - (RIM.ry + 2) * Math.sqrt(Math.max(0, 1 - (dx / rx) ** 2));
  MOUND.forEach(m => { const d = x - m[0]; if(Math.abs(d) < m[2]) y = Math.min(y, m[1] - Math.sqrt(m[2] * m[2] - d * d)); });
  return y;
}
function moundPath(c){
  const rx = RIM.rx - 3;
  c.beginPath(); c.moveTo(CX - rx, RIM.y);
  for(let x = CX - rx; x <= CX + rx; x += 1.5) c.lineTo(x, moundTop(x));
  c.lineTo(CX + rx, RIM.y);
  c.ellipse(CX, RIM.y, rx, RIM.ry + 2, 0, 0, Math.PI, false);
  c.closePath();
}
function goo(c){
  c.save();
  // only above the front rim
  c.beginPath(); c.rect(0, 0, W, RIM.y); c.ellipse(CX, RIM.y, RIM.rx, RIM.ry, 0, 0, Math.PI * 2); c.clip();

  c.save();
  moundPath(c);
  c.shadowColor = "rgba(150,255,60,0.6)"; c.shadowBlur = 50;
  c.fillStyle = radial(c, CX - 40, RIM.y - 60, 280, [[0, "#ecffa6"], [0.22, "#bff04c"], [0.55, "#80c826"], [0.9, "#3e7c12"], [1, "#2c5c0b"]], CX - 70, RIM.y - 100, 0);
  c.fill();
  c.restore();

  moundPath(c); c.clip();
  // depth toward the rim
  c.fillStyle = grad(c, 0, RIM.y - 40, 0, RIM.y + 36, [[0, "rgba(20,60,5,0)"], [1, "rgba(20,60,5,0.65)"]]);
  c.fillRect(0, 0, W, H);
  // soft texture: lighter and darker blotches
  const r = rng(5);
  c.filter = "blur(6px)";
  c.globalCompositeOperation = "soft-light";
  for(let i = 0; i < 40; i++){
    c.fillStyle = r() < 0.5 ? "rgba(255,255,200,0.55)" : "rgba(10,40,0,0.55)";
    c.beginPath(); c.arc(CX + (r() * 2 - 1) * 190, RIM.y - 130 + r() * 160, 6 + r() * 20, 0, Math.PI * 2); c.fill();
  }
  c.globalCompositeOperation = "source-over";
  c.filter = "none";
  // inner rim light
  moundPath(c); c.strokeStyle = "rgba(225,255,160,0.45)"; c.lineWidth = 5; c.stroke();
  // speculars
  c.filter = "blur(1.5px)";
  [[CX - 92, RIM.y - 88, 30, 11, -0.55, 0.6], [CX + 10, RIM.y - 112, 20, 7, -0.2, 0.5], [CX + 104, RIM.y - 74, 14, 5, 0.4, 0.4]].forEach(s => {
    c.fillStyle = "rgba(255,255,245," + s[5] + ")";
    c.beginPath(); c.ellipse(s[0], s[1], s[2], s[3], s[4], 0, Math.PI * 2); c.fill();
  });
  c.filter = "none";
  // bubbles
  [[CX - 70, RIM.y - 40, 15], [CX + 36, RIM.y - 86, 18], [CX - 140, RIM.y - 14, 9], [CX + 120, RIM.y - 36, 11],
   [CX + 72, RIM.y - 22, 7], [CX - 18, RIM.y - 10, 6], [CX - 110, RIM.y - 62, 6], [CX + 152, RIM.y - 10, 6]].forEach(b => bubble(c, b[0], b[1], b[2]));
  // a popping bubble
  c.strokeStyle = "rgba(230,255,170,0.6)"; c.lineWidth = 1.5; c.setLineDash([4, 5]);
  c.beginPath(); c.ellipse(CX + 70, RIM.y - 115, 12, 6, 0, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
  c.restore();
}
function bubble(c, x, y, r){
  c.fillStyle = radial(c, x, y, r, [[0, "rgba(200,255,120,0.05)"], [0.75, "rgba(220,255,150,0.25)"], [1, "rgba(240,255,190,0.55)"]]);
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "rgba(35,85,8,0.55)"; c.lineWidth = 1.6; c.stroke();
  c.strokeStyle = "rgba(255,255,240,0.85)"; c.lineWidth = Math.max(1.2, r * 0.14); c.lineCap = "round";
  c.beginPath(); c.arc(x, y, r * 0.68, Math.PI * 1.1, Math.PI * 1.45); c.stroke();
  c.fillStyle = "rgba(255,255,255,0.9)";
  c.beginPath(); c.arc(x + r * 0.35, y + r * 0.35, Math.max(0.8, r * 0.1), 0, Math.PI * 2); c.fill();
}

// ---------- drips over the front ----------
const DRIPS = [[-142, 66, 22], [-80, 118, 27], [-14, 178, 31], [58, 92, 24], [124, 140, 26]];
function dripPath(c, x, top, len, w){
  const rb = w * 0.62, f = 9;
  c.beginPath();
  c.moveTo(x - w / 2 - f, top);
  c.quadraticCurveTo(x - w / 2, top, x - w / 2, top + f + 4);
  c.lineTo(x - w * 0.42, top + len - rb * 0.6);
  c.arc(x, top + len, rb, Math.PI + 0.75, -0.75 + Math.PI * 2 + Math.PI * 0.0, true);
  c.lineTo(x + w / 2, top + f + 4);
  c.quadraticCurveTo(x + w / 2, top, x + w / 2 + f, top);
  c.closePath();
}
function drips(c){
  dripsBody(c);
  drop(c, CX + 232, BOT.y + 10, 6);   // one drop that ran down the side, at the puddle's edge
}
function dripsBody(c){
  // the goo lip along the front rim
  c.save(); c.lineCap = "round";
  c.beginPath(); c.ellipse(CX, RIM.y - 4, RIM.rx - 2, RIM.ry, 0, 0.12, Math.PI - 0.12);
  c.strokeStyle = "#5a9e17"; c.lineWidth = 9; c.stroke();
  c.beginPath(); c.ellipse(CX, RIM.y - 7, RIM.rx - 6, RIM.ry, 0, 0.3, Math.PI - 0.3);
  c.strokeStyle = "rgba(230,255,160,0.5)"; c.lineWidth = 2; c.stroke();
  c.restore();

  DRIPS.forEach(d => {
    const x = CX + d[0], top = RIM.y + RIM.ry * Math.sqrt(1 - (d[0] / RIM.rx) ** 2) - 9, len = d[1], w = d[2];
    // shadow on the metal
    c.save(); c.translate(5, 5); dripPath(c, x, top, len, w);
    c.filter = "blur(4px)"; c.fillStyle = "rgba(0,20,0,0.45)"; c.fill(); c.restore();
    // body
    c.save();
    dripPath(c, x, top, len, w);
    c.shadowColor = "rgba(140,255,60,0.35)"; c.shadowBlur = 12;
    c.fillStyle = grad(c, x - w * 0.7, 0, x + w * 0.7, 0, [[0, "#2f6a0c"], [0.3, "#9bdc34"], [0.5, "#b8ef4d"], [0.8, "#5fa31a"], [1, "#2b5e0a"]]);
    c.fill();
    c.shadowColor = "transparent";
    c.strokeStyle = "rgba(25,60,5,0.7)"; c.lineWidth = 1.4; c.stroke();
    c.restore();
    // highlight streak + bulb glint
    c.save(); c.lineCap = "round";
    c.strokeStyle = "rgba(245,255,220,0.6)"; c.lineWidth = w * 0.13;
    c.beginPath(); c.moveTo(x - w * 0.2, top + 14); c.lineTo(x - w * 0.18, top + len - w * 0.6); c.stroke();
    c.fillStyle = "rgba(255,255,245,0.9)";
    c.beginPath(); c.ellipse(x - w * 0.22, top + len - w * 0.12, w * 0.1, w * 0.17, -0.3, 0, Math.PI * 2); c.fill();
    c.restore();
  });
}

// ---------- sparkle ----------
function star(c, x, y, R, r){
  c.beginPath(); c.moveTo(x, y - R);
  c.quadraticCurveTo(x + r, y - r, x + R, y);
  c.quadraticCurveTo(x + r, y + r, x, y + R);
  c.quadraticCurveTo(x - r, y + r, x - R, y);
  c.quadraticCurveTo(x - r, y - r, x, y - R);
}
function sparkle(c, x, y, R){
  c.save();
  c.globalCompositeOperation = "lighter";
  c.fillStyle = radial(c, x, y, R * 2.6, [[0, "rgba(255,215,130,0.55)"], [0.35, "rgba(248,187,86,0.18)"], [1, "rgba(248,187,86,0)"]]);
  c.fillRect(x - R * 3, y - R * 3, R * 6, R * 6);
  // lens rays
  [[R * 3.4, 1.4, 0], [R * 3.4, 1.4, Math.PI / 2], [R * 1.5, 0.9, Math.PI / 4], [R * 1.5, 0.9, -Math.PI / 4]].forEach(ray => {
    c.save(); c.translate(x, y); c.rotate(ray[2]);
    c.fillStyle = grad(c, -ray[0], 0, ray[0], 0, [[0, "rgba(255,220,150,0)"], [0.5, "rgba(255,240,200,0.7)"], [1, "rgba(255,220,150,0)"]]);
    c.fillRect(-ray[0], -ray[1] / 2, ray[0] * 2, ray[1]);
    c.restore();
  });
  c.globalCompositeOperation = "source-over";
  star(c, x, y, R, R * 0.14);
  c.shadowColor = "rgba(255,200,100,0.9)"; c.shadowBlur = 18;
  c.fillStyle = radial(c, x, y, R, [[0, "#ffffff"], [0.18, "#fff6dc"], [0.55, "#ffd98a"], [1, "#e9a43f"]]);
  c.fill();
  c.shadowColor = "transparent";
  c.strokeStyle = "rgba(255,250,230,0.7)"; c.lineWidth = 1; c.stroke();
  c.globalCompositeOperation = "lighter";
  c.fillStyle = radial(c, x, y, R * 0.35, [[0, "rgba(255,255,255,0.9)"], [1, "rgba(255,255,255,0)"]]);
  c.fillRect(x - R, y - R, R * 2, R * 2);
  c.restore();
}
function sparkles(c){
  sparkle(c, 862, 118, 62);
  sparkle(c, 782, 82, 20);
  const r = rng(11);
  c.save(); c.globalCompositeOperation = "lighter";
  for(let i = 0; i < 14; i++){
    const a = r() * Math.PI * 2, d = 70 + r() * 110, x = 840 + Math.cos(a) * d, y = 112 + Math.sin(a) * d * 0.8, s = 0.8 + r() * 2.2;
    c.fillStyle = radial(c, x, y, s * 3, [[0, "rgba(255,230,170,0.9)"], [1, "rgba(255,200,100,0)"]]);
    c.fillRect(x - s * 3, y - s * 3, s * 6, s * 6);
  }
  c.restore();
}

// ---------- lettering ----------
const TITLE = "POMYJE", FS = 196, BASE = 770, SPACING = 6;
let titleX0 = 0;
const TDRIPS = [[0, 0.16, 30, 48], [2, 0.87, 26, 32], [3, 0.5, 32, 58], [5, 0.17, 26, 38]];   // letter, x within it (its ink box), width, length
function titleFont(c){ c.font = "700 " + FS + "px 'Space Grotesk'"; c.letterSpacing = "0px"; c.textBaseline = "alphabetic"; c.textAlign = "left"; }
// Letters are placed one by one, so the drips know exactly where each is.
function letterBox(c, i){
  let x = titleX0;
  for(let j = 0; j < i; j++) x += c.measureText(TITLE[j]).width + SPACING;
  const m = c.measureText(TITLE[i]);
  return { pen: x, x: x - m.actualBoundingBoxLeft, w: m.actualBoundingBoxLeft + m.actualBoundingBoxRight };
}
function titleWidth(c){ let w = -SPACING; for(const ch of TITLE) w += c.measureText(ch).width + SPACING; return w; }
function glyphs(c, ox, oy, mode){
  titleFont(c);
  for(let i = 0; i < TITLE.length; i++){
    const pen = letterBox(c, i).pen + ox;
    if(mode === "fill") c.fillText(TITLE[i], pen, BASE + oy); else c.strokeText(TITLE[i], pen, BASE + oy);
  }
  TDRIPS.forEach(d => {
    const b = letterBox(c, d[0]), x = b.x + b.w * d[1] + ox;
    c.beginPath();
    const top = BASE - 24 + oy, w = d[2], len = d[3] + 10, rb = w * 0.6;
    c.moveTo(x - w / 2 - 10, top + 24);
    c.quadraticCurveTo(x - w / 2, top + 24, x - w / 2 + 1, top + 34);
    c.lineTo(x - w * 0.4, top + len - rb * 0.5);
    c.arc(x, top + len, rb, Math.PI + 0.7, -0.7, true);
    c.lineTo(x + w / 2 - 1, top + 34);
    c.quadraticCurveTo(x + w / 2, top + 24, x + w / 2 + 10, top + 24);
    c.lineTo(x + w / 2 + 10, top); c.lineTo(x - w / 2 - 10, top);
    c.closePath();
    if(mode === "fill") c.fill(); else c.stroke();
  });
}
function masked(paint){
  // an offscreen copy of the letter shapes; `paint` draws into it with source-atop
  const o = document.createElement("canvas"); o.width = cv.width; o.height = cv.height;
  const oc = o.getContext("2d"); oc.scale(S, S);
  oc.fillStyle = "#fff"; glyphs(oc, 0, 0, "fill");
  oc.globalCompositeOperation = "source-atop";
  paint(oc);
  return o;
}
function title(c){
  titleFont(c);
  titleX0 = CX - titleWidth(c) / 2;
  c.save(); c.lineJoin = "round";
  // glow + floor shadow
  c.shadowColor = "rgba(130,240,50,0.45)"; c.shadowBlur = 60;
  c.fillStyle = "#1b3a07"; glyphs(c, 0, 10, "fill");
  c.shadowColor = "rgba(0,0,0,0.8)"; c.shadowBlur = 22; c.shadowOffsetY = 16 * S;
  glyphs(c, 0, 10, "fill");
  c.shadowColor = "transparent"; c.shadowBlur = 0; c.shadowOffsetY = 0;
  // extrusion: an outline of the deepest layer, then layers up to the face
  c.strokeStyle = "#0d1f05"; c.lineWidth = 16; glyphs(c, 0, 13, "stroke");
  for(let k = 13; k >= 1; k--){
    const t = k / 13;
    c.fillStyle = "rgb(" + Math.round(lerp(78, 26, t)) + "," + Math.round(lerp(140, 60, t)) + "," + Math.round(lerp(22, 8, t)) + ")";
    glyphs(c, 0, k, "fill");
  }
  c.strokeStyle = "#112a06"; c.lineWidth = 9; glyphs(c, 0, 0, "stroke");
  // face
  c.fillStyle = grad(c, 0, BASE - FS * 0.74, 0, BASE + 60, [[0, "#f3ffb2"], [0.3, "#c6f44f"], [0.62, "#86cc27"], [1, "#4e9214"]]);
  glyphs(c, 0, 0, "fill");
  c.restore();

  // gloss, inner shade and bubbles, clipped to the letters
  const gloss = masked(oc => {
    oc.globalCompositeOperation = "source-in";
    oc.fillStyle = grad(oc, 0, BASE - FS * 0.75, 0, BASE + 70, [[0, "rgba(255,255,230,0.0)"], [0.01, "rgba(255,255,230,0.55)"], [0.38, "rgba(255,255,230,0.12)"], [0.39, "rgba(255,255,230,0)"], [0.75, "rgba(15,50,0,0)"], [1, "rgba(15,50,0,0.55)"]]);
    oc.fillRect(0, 0, W, H);
    oc.globalCompositeOperation = "source-atop";
    const r = rng(3);
    for(let i = 0; i < 16; i++){
      const x = titleX0 + r() * (W - 2 * titleX0), y = BASE - FS * 0.6 + r() * FS * 0.6, s = 2 + r() * 6;
      oc.strokeStyle = "rgba(240,255,200,0.55)"; oc.lineWidth = 1.2;
      oc.beginPath(); oc.arc(x, y, s, 0, Math.PI * 2); oc.stroke();
      oc.fillStyle = "rgba(255,255,255,0.8)";
      oc.beginPath(); oc.arc(x - s * 0.35, y - s * 0.35, Math.max(0.7, s * 0.2), 0, Math.PI * 2); oc.fill();
    }
    oc.strokeStyle = "rgba(255,255,220,0.5)"; oc.lineWidth = 3;
    glyphs(oc, 0, 2.5, "stroke");   // a bright inner edge along the tops
  });
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(gloss, 0, 0); c.restore();

  // glints on the drip bulbs
  titleFont(c);
  TDRIPS.forEach(d => {
    const b = letterBox(c, d[0]), x = b.x + b.w * d[1], y = BASE - 24 + d[3] + 10;
    c.fillStyle = "rgba(255,255,245,0.9)";
    c.beginPath(); c.ellipse(x - d[2] * 0.2, y - d[2] * 0.1, d[2] * 0.1, d[2] * 0.17, -0.3, 0, Math.PI * 2); c.fill();
  });
}

function studio(c){
  const y = 872;
  c.save();
  c.font = "600 44px 'Space Grotesk'"; c.letterSpacing = "22px"; c.textAlign = "left"; c.textBaseline = "alphabetic";
  const tw = c.measureText("STUDIO").width - 22, x0 = CX - tw / 2;
  c.shadowColor = "rgba(0,0,0,0.7)"; c.shadowBlur = 8; c.shadowOffsetY = 3 * S;
  c.fillStyle = grad(c, 0, y - 34, 0, y + 4, [[0, "#ffffff"], [0.5, "#d3d8e0"], [0.55, "#9aa2ae"], [1, "#c4cad3"]]);
  c.fillText("STUDIO", x0, y);
  c.restore();
  [-1, 1].forEach(s => {
    const near = CX + s * (tw / 2 + 38), far = CX + s * (tw / 2 + 250), ly = y - 15;
    c.fillStyle = grad(c, near, 0, far, 0, [[0, "rgba(200,206,216,0.95)"], [1, "rgba(200,206,216,0)"]]);
    c.fillRect(Math.min(near, far), ly - 1.5, Math.abs(far - near), 3);
    c.save(); c.translate(near, ly); c.rotate(Math.PI / 4);
    c.shadowColor = "rgba(248,187,86,0.8)"; c.shadowBlur = 10;
    c.fillStyle = "#f8bb56"; c.fillRect(-5, -5, 10, 10);
    c.restore();
  });
}

function tagline(c){
  const y = 942;
  c.save();
  c.font = "600 64px 'Space Grotesk'"; c.letterSpacing = "1px"; c.textAlign = "center"; c.textBaseline = "alphabetic";
  c.translate(CX, y); c.transform(1, 0, -0.24, 1, 0, 0);
  c.shadowColor = "rgba(248,187,86,0.65)"; c.shadowBlur = 26;
  c.fillStyle = "#a8661c"; c.fillText("Prompt & Pray", 0, 3);
  c.shadowColor = "rgba(0,0,0,0.6)"; c.shadowBlur = 4; c.shadowOffsetY = 2 * S;
  c.fillStyle = grad(c, 0, -48, 0, 14, [[0, "#fff1c9"], [0.45, "#ffd27a"], [0.75, "#f8bb56"], [1, "#d38b37"]]);
  c.fillText("Prompt & Pray", 0, 0);
  c.restore();
}

// ---------- finish: vignette + film grain ----------
function finish(c){
  if(!BG) return;
  c.fillStyle = radial(c, CX, H / 2, 820, [[0.55, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,0.55)"]]);
  c.fillRect(0, 0, W, H);
  const img = c.getImageData(0, 0, cv.width, cv.height), d = img.data, r = rng(99);
  for(let i = 0; i < d.length; i += 4){
    const n = (r() - 0.5) * 9;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  c.putImageData(img, 0, 0);
}

async function render(){
  await Promise.all([document.fonts.load("700 100px 'Space Grotesk'"), document.fonts.load("600 40px 'Space Grotesk'")]);
  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if(BG) background(ctx);
  floor(ctx);
  handle(ctx);
  body(ctx);
  rimBack(ctx);
  goo(ctx);
  rimFront(ctx);
  drips(ctx);
  sparkles(ctx);
  title(ctx);
  studio(ctx);
  tagline(ctx);
  finish(ctx);
  window.logoReady = true;
}
render();

document.getElementById("save").addEventListener("click", function(){
  cv.toBlob(function(b){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = BG ? "pomyje-studio.png" : "pomyje-studio-transparent.png"; a.click();
  });
});
</script>
