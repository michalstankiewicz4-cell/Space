<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ship Editor // Swarm Protocol</title>
<!-- Standalone prototype, not linked from the game (same treatment as
     planetEditor.html/admin.html). First pass at a Space-Engineers-style block
     ship builder: a 10x10x10 grid, a category+shape+color picker on the
     right, left-click to place, shift+left-click to remove. No hidden-face
     culling or any other draw-call optimization yet — explicitly deferred,
     see the note above buildBlockMesh() below. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #05060a;
    --panel: rgba(12,18,32,0.88);
    --panel-edge: rgba(79,227,198,0.35);
    --teal: #4fe3c6;
    --ink: #e8ecf3;
    --ink-dim: #8a93a8;
    --danger: #ff4f81;
    --font-head: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background: var(--void); font-family: var(--font-mono); color: var(--ink); }
  canvas{ display:block; touch-action:none; cursor: crosshair; }

  /* Themed scrollbar, matching css/style.css (game + planetEditor.html/
     admin.html, which pull it in via that shared stylesheet) — this file
     has no shared stylesheet of its own, so it's duplicated here. */
  *{ scrollbar-width: thin; scrollbar-color: rgba(79,227,198,0.55) rgba(255,255,255,0.05); }
  *::-webkit-scrollbar{ width: 10px; height: 10px; }
  *::-webkit-scrollbar-track{ background: rgba(255,255,255,0.05); }
  *::-webkit-scrollbar-thumb{
    background-color: rgba(79,227,198,0.55); border-radius: 6px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  *::-webkit-scrollbar-thumb:hover{ background-color: rgba(79,227,198,0.85); }
  *::-webkit-scrollbar-corner{ background: transparent; }

  #sidebar{
    position:fixed; top:0; right:0; bottom:0; width:270px;
    background: var(--panel); border-left: 1px solid var(--panel-edge);
    padding: 18px 16px 16px; overflow-y:auto;
    display:flex; flex-direction:column; gap:4px;
  }
  #sidebar h1{ font-family: var(--font-head); font-size:16px; margin:0 0 2px; color: var(--ink); }
  #sidebar h1 span{ color: var(--teal); }
  .hint{ font-size:11px; color: var(--ink-dim); line-height:1.6; margin: 0 0 14px; }
  .hint b{ color: var(--ink); }
  h2{
    font-family: var(--font-head); font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    color: var(--teal); margin: 14px 0 6px;
  }
  .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pickBtn{
    display:flex; align-items:center; gap:7px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--panel-edge);
    color: var(--ink); font-family: var(--font-mono); font-size:11.5px;
    padding: 7px 8px; cursor:pointer; text-align:left;
  }
  .pickBtn:hover{ border-color: var(--teal); }
  .pickBtn.active{ background: rgba(79,227,198,0.16); border-color: var(--teal); color: var(--teal); }
  .swatch{ width:11px; height:11px; flex:none; border-radius:2px; border:1px solid rgba(255,255,255,0.3); }

  #colorRow{ display:flex; align-items:center; gap:8px; margin: 4px 0; }
  #colorPicker{ width:40px; height:30px; padding:0; border:1px solid var(--panel-edge); background:none; cursor:pointer; }
  #colorResetBtn{
    flex:1; background: rgba(255,255,255,0.05); border: 1px solid var(--panel-edge);
    color: var(--ink-dim); font-family: var(--font-mono); font-size: 11px; padding: 8px 6px; cursor:pointer;
  }
  #colorResetBtn:hover{ color: var(--ink); border-color: var(--teal); }

  #rotateBtn{
    margin-top: 10px; width:100%;
    font-family: var(--font-head); font-weight:600; font-size:13px;
    background: rgba(255,255,255,0.06); color: var(--ink); border: 1px solid var(--panel-edge);
    padding: 9px 0; cursor:pointer;
  }
  #rotateBtn:hover{ border-color: var(--teal); color: var(--teal); }

  #statusLine{
    margin-top: 14px; font-size:11.5px; color: var(--ink-dim); line-height:1.7;
    border-top: 1px solid rgba(79,227,198,0.2); padding-top: 10px;
  }
  #statusLine b{ color: var(--teal); }

  #bottomButtons{ margin-top: auto; display:flex; flex-direction:column; gap:8px; padding-top: 14px; }
  #bottomButtons button{
    font-family: var(--font-mono); font-size:12px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--panel-edge);
    color: var(--ink); padding: 9px 0; cursor:pointer;
  }
  #bottomButtons button:hover{ border-color: var(--teal); color: var(--teal); }
  #clearBtn:hover{ border-color: var(--danger); color: var(--danger); }
</style>
</head>
<body>

<div id="stage"></div>

<div id="sidebar">
  <h1>SHIP <span>EDITOR</span></h1>
  <p class="hint">
    <b>Left click</b> = place (or extend from a block's face) &middot;
    <b>Ctrl+click</b> = remove &middot;
    <b>Shift+drag</b> = place a row &middot;
    <b>Ctrl+Shift+drag</b> = remove a row &middot;
    <b>right-drag</b> = orbit camera &middot; <b>scroll</b> = zoom &middot; <b>R</b> = rotate pending block
  </p>

  <h2>Category</h2>
  <div id="categoryButtons" class="grid2"></div>

  <h2>Shape</h2>
  <div id="shapeButtons" class="grid2"></div>

  <h2>Color</h2>
  <div id="colorRow">
    <input id="colorPicker" type="color">
    <button id="colorResetBtn" type="button">Reset to category</button>
  </div>

  <button id="rotateBtn" type="button">⟳ Rotate pending block</button>

  <div id="statusLine"></div>

  <div id="bottomButtons">
    <button id="clearBtn" type="button">✕ Clear all blocks</button>
    <button id="downloadBtn" type="button">⬇ Download ship (JSON)</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  "use strict";

  // ---------- grid model ----------

  const GRID_SIZE = 10;
  const CELL_SIZE = 1;
  const GRID_OFFSET = (GRID_SIZE - 1) / 2; // centers the whole 10x10x10 volume on the world origin

  function cellKey(x, y, z){ return x + "," + y + "," + z; }
  function inBounds(x, y, z){ return x>=0 && x<GRID_SIZE && y>=0 && y<GRID_SIZE && z>=0 && z<GRID_SIZE; }
  function cellCenterWorld(x, y, z){
    return new THREE.Vector3(
      (x - GRID_OFFSET) * CELL_SIZE,
      (y - GRID_OFFSET) * CELL_SIZE,
      (z - GRID_OFFSET) * CELL_SIZE
    );
  }

  // key -> { mesh, category, shape, color (hex string), rotationY (0-3) }
  const blocks = new Map();

  // ---------- categories / shapes ----------

  const CATEGORIES = [
    { id: "hull",     label: "Poszycie",   color: "#6b7480" },
    { id: "habitat",  label: "Mieszkalny", color: "#8fd88f" },
    { id: "command",  label: "Dowództwo",  color: "#4fa8ff" },
    { id: "computer", label: "Komputer",   color: "#4fe3c6" },
    { id: "ai",       label: "AI",         color: "#b98cff" }
  ];
  const SHAPES = [
    { id: "cube",  label: "Zwykły" },
    { id: "wedge", label: "Skośny" },
    { id: "round", label: "Zaokrąglony" }
  ];

  let selectedCategory = CATEGORIES[0];
  let selectedShape = SHAPES[0];
  let selectedColor = selectedCategory.color;
  let pendingRotationY = 0; // 0..3, each step = 90deg around Y

  // ---------- block geometry builders ----------
  // Every shape is built to fit inside a unit cell centered on its own local
  // origin (roughly -0.48..0.48 per axis, leaving a thin gap between
  // neighboring blocks so individual pieces stay visually distinct — the
  // usual trick voxel/block-building games use to keep a grid readable).
  //
  // NOT DONE YET, ON PURPOSE (see the user's own "optimize later" framing):
  // no hidden-face culling / greedy meshing between adjacent solid blocks.
  // Every block renders all of its own faces regardless of neighbors, which
  // is fine for a design prototype but would need addressing before this
  // scales to a real, large, always-rendered ship.

  function makeCubeMesh(mat){
    return new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.96, 0.96), mat);
  }

  // A right-triangular prism (ramp): full height at z=+0.48 (the "back"),
  // tapering to zero height at z=-0.48 (the "front" — where the slope
  // meets the ground), flat width-wise across x. Hand-built (no built-in
  // THREE "wedge" primitive) — DoubleSide on the material is a deliberate
  // safety net for any triangle-winding mistakes below, not just a light-
  // ing nicety: with it, a backwards face still renders instead of
  // vanishing outright.
  function makeWedgeMesh(mat){
    const s = 0.48;
    const P0=[-s,-s,-s], P1=[-s,-s, s], P2=[-s, s, s];
    const P3=[ s,-s,-s], P4=[ s,-s, s], P5=[ s, s, s];
    const tris = [
      P0,P3,P4,  P0,P4,P1,      // bottom (y=-s)
      P1,P4,P5,  P1,P5,P2,      // back (z=+s)
      P0,P1,P2,                 // left end cap (x=-s)
      P3,P5,P4,                 // right end cap (x=+s)
      P0,P5,P3,  P0,P2,P5       // slope (front-bottom -> back-top)
    ];
    const positions = new Float32Array(tris.length * 3);
    for(let i=0;i<tris.length;i++){
      positions[i*3] = tris[i][0]; positions[i*3+1] = tris[i][1]; positions[i*3+2] = tris[i][2];
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, mat);
  }

  // A rounded outer corner — a quarter-circle "pie slice" cross-section
  // extruded into a solid via THREE.ExtrudeGeometry (which generates both
  // caps and the side walls correctly on its own, unlike a hand-built
  // partial CylinderGeometry, which doesn't close its own radial cut
  // faces). The concave (sharp) corner sits at this cell's -x/-z/-y
  // corner; the curve bulges out toward +x/+z, so four of these rotated
  // 0/90/180/270 tile into a full rounded column.
  function makeRoundMesh(mat){
    const r = 0.48;
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.lineTo(r, 0);
    shape.absarc(0, 0, r, 0, Math.PI/2, false);
    shape.lineTo(0, 0);
    const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.96, bevelEnabled: false, curveSegments: 10 });
    // Shape lives in the extruder's local XY plane, extruded along +Z.
    // Re-map that to our cell's (x, z, y) so the extrusion becomes height.
    geo.rotateX(-Math.PI/2);
    geo.translate(-r, -0.48, r);
    return new THREE.Mesh(geo, mat);
  }

  function buildBlockMesh(shapeId, colorHex){
    const mat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.35, roughness: 0.55, side: THREE.DoubleSide });
    if(shapeId === "wedge") return makeWedgeMesh(mat);
    if(shapeId === "round") return makeRoundMesh(mat);
    return makeCubeMesh(mat);
  }

  function disposeMesh(mesh){
    mesh.traverse(function(obj){
      if(obj.geometry) obj.geometry.dispose();
      if(obj.material) obj.material.dispose();
    });
  }

  // ---------- scene setup ----------

  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth - 270, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05060a);

  const camera = new THREE.PerspectiveCamera(50, (window.innerWidth-270) / window.innerHeight, 0.1, 500);
  camera.position.set(14, 11, 14);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.minDistance = 4;
  controls.maxDistance = 40;
  // Right-drag rotates (matches the game's own camera convention); left
  // button is deliberately left unmapped here so it's fully free for our
  // own block placement/removal handler below.
  controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

  scene.add(new THREE.HemisphereLight(0x2a3a55, 0x05050a, 0.6));
  const sun = new THREE.DirectionalLight(0xfff2e0, 1.2);
  sun.position.set(20, 25, 15);
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x4fe3c6, 0.3);
  rim.position.set(-15, -10, -20);
  scene.add(rim);

  // Bounding-box wireframe + a floor grid, purely for spatial reference —
  // a 10x10x10 void with no cues is hard to judge depth/position in.
  const boundsGeo = new THREE.BoxGeometry(GRID_SIZE*CELL_SIZE, GRID_SIZE*CELL_SIZE, GRID_SIZE*CELL_SIZE);
  const bounds = new THREE.LineSegments(
    new THREE.EdgesGeometry(boundsGeo),
    new THREE.LineBasicMaterial({ color: 0x4fe3c6, transparent: true, opacity: 0.35 })
  );
  scene.add(bounds);
  const floorGrid = new THREE.GridHelper(GRID_SIZE*CELL_SIZE, GRID_SIZE, 0x4fe3c6, 0x1c2230);
  floorGrid.position.y = -GRID_SIZE*CELL_SIZE/2;
  scene.add(floorGrid);

  window.addEventListener("resize", function(){
    const w = window.innerWidth - 270, h = window.innerHeight;
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  // ---------- pick colliders (one invisible box per grid cell) ----------
  // Same "transparent but still visible:true" trick as the game's own ship/
  // drone pick meshes (see js/ships/swarm.js) — raycasting skips anything
  // with visible:false, so full transparency (not invisibility) is what
  // keeps a mesh raycastable while rendering nothing.
  const pickGeo = new THREE.BoxGeometry(CELL_SIZE, CELL_SIZE, CELL_SIZE);
  const pickMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0 });
  const cellColliders = [];
  for(let x=0;x<GRID_SIZE;x++){
    for(let y=0;y<GRID_SIZE;y++){
      for(let z=0;z<GRID_SIZE;z++){
        const collider = new THREE.Mesh(pickGeo, pickMat);
        collider.position.copy(cellCenterWorld(x,y,z));
        collider.userData.cell = { x, y, z };
        scene.add(collider);
        cellColliders.push(collider);
      }
    }
  }

  // Ghost/hover preview — a pool of thin wireframe cubes (reused, not
  // recreated every frame) showing every cell the current action would
  // touch: just one under the cursor normally, or the whole line during a
  // Shift-drag. Teal = would place, red = would remove (Ctrl held) — see
  // updateGhosts() below. Sized generously above the longest possible line
  // in a 10-cell grid (a full space-diagonal is sqrt(300)~=17.3 cells).
  const GHOST_POOL_SIZE = 20;
  const ghostPlaceMat = new THREE.LineBasicMaterial({ color: 0x4fe3c6 });
  const ghostRemoveMat = new THREE.LineBasicMaterial({ color: 0xff4f81 });
  const ghostGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(0.98, 0.98, 0.98));
  const ghostPool = [];
  for(let i=0;i<GHOST_POOL_SIZE;i++){
    const g = new THREE.LineSegments(ghostGeo, ghostPlaceMat);
    g.visible = false;
    scene.add(g);
    ghostPool.push(g);
  }
  function updateGhosts(cells, removing){
    const mat = removing ? ghostRemoveMat : ghostPlaceMat;
    for(let i=0;i<ghostPool.length;i++){
      const g = ghostPool[i];
      if(i < cells.length){
        g.visible = true;
        g.material = mat;
        g.position.copy(cellCenterWorld(cells[i].x, cells[i].y, cells[i].z));
      } else {
        g.visible = false;
      }
    }
  }
  function hideGhosts(){ ghostPool.forEach(function(g){ g.visible = false; }); }

  // ---------- raycasting / interaction ----------

  const raycaster = new THREE.Raycaster();
  function ndcFromEvent(e){
    const rect = renderer.domElement.getBoundingClientRect();
    return {
      x: ((e.clientX-rect.left)/rect.width)*2 - 1,
      y: -((e.clientY-rect.top)/rect.height)*2 + 1
    };
  }

  // Snaps a world-space direction to the single nearest cardinal axis
  // ({x,y,z}, exactly one component is +-1) — used to turn a raycast
  // hit's face normal into "which of the 6 neighboring cells is this
  // face pointing at". Works cleanly for axis-aligned faces (cube, and
  // most of wedge/round's faces); for a genuinely angled face (the wedge's
  // slope, the round block's curve) it's an approximation — picks
  // whichever cardinal direction the normal leans closest to — good
  // enough for "extend roughly this way" rather than needing to be exact.
  function snapToAxis(v){
    const ax = Math.abs(v.x), ay = Math.abs(v.y), az = Math.abs(v.z);
    if(ax >= ay && ax >= az) return { x: v.x > 0 ? 1 : -1, y: 0, z: 0 };
    if(ay >= ax && ay >= az) return { x: 0, y: v.y > 0 ? 1 : -1, z: 0 };
    return { x: 0, y: 0, z: v.z > 0 ? 1 : -1 };
  }

  // One combined raycast against every placed block AND every STILL-EMPTY
  // cell's collider. A real block hit ANYWHERE along the ray always wins
  // over an empty-cell hit, even one that's geometrically closer to the
  // camera — empty cells' colliders are fully invisible (opacity 0), so
  // there's nothing on screen for the player to have aimed at there; the
  // only thing they can actually SEE and click on is a block's own solid
  // face. Without this, a block that isn't on the near-facing outer shell
  // (e.g. a single block on the grid's top layer, viewed from underneath
  // through the otherwise-empty column below it) was unreachable by face
  // detection: the ray's closest hit was always the nearest empty cell's
  // invisible collider, resolving to "empty space" instead of the visible
  // block the player was actually pointing at (reported live: hovering the
  // underside of a lone top-layer block did nothing, since every empty
  // cell below it silently absorbed the ray first). A block still
  // correctly wins over another block behind it (closest-block-first,
  // same as before — `hits` is already distance-sorted), and an empty
  // cell only wins when NO block lies anywhere along the ray, so this
  // can't make you "place through" a block that's actually in front.
  //
  // Occupied cells' own colliders are deliberately excluded here, not just
  // left in and expected to lose the distance comparison: a cell's
  // collider (a full 1x1x1 box) is slightly LARGER than most block shapes
  // (0.96 cubes, and wedge/round shapes cover even less of the cell), so
  // with both left in the ray could hit the invisible collider's surface
  // a hair before the actual block's smaller geometry — reporting the
  // click as landing on an "empty" cell even though a block sits right
  // there, silently swallowing removal. Found by testing an isolated
  // single block (place, then immediately click-remove the same spot)
  // rather than assuming the distance-sort alone was enough.
  //
  // Returns { kind:"empty", cell } or { kind:"block", cell, adjacentCell }
  // — `cell` is the hit block's own cell (what Ctrl-click removes),
  // `adjacentCell` is the neighbor in the direction of the hit FACE (what
  // a plain click extends into — face detection per the user's own
  // request), or null if that neighbor is out of grid bounds.
  function resolveHit(e){
    const ndc = ndcFromEvent(e);
    raycaster.setFromCamera(ndc, camera);
    const blockMeshes = Array.from(blocks.values()).map(function(b){ return b.mesh; });
    const blockMeshSet = new Set(blockMeshes);
    const emptyColliders = cellColliders.filter(function(c){
      const p = c.userData.cell;
      return !blocks.has(cellKey(p.x, p.y, p.z));
    });
    const hits = raycaster.intersectObjects(blockMeshes.concat(emptyColliders), false);
    if(hits.length === 0) return null;
    const hit = hits.find(function(h){ return blockMeshSet.has(h.object); }) || hits[0];
    const blockEntry = Array.from(blocks.entries()).find(function(e2){ return e2[1].mesh === hit.object; });
    if(blockEntry){
      const c = keyToCell(blockEntry[0]);
      let adjacentCell = null, faceAxis = null;
      if(hit.face){
        const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
        faceAxis = snapToAxis(normal);
        const adj = { x: c.x+faceAxis.x, y: c.y+faceAxis.y, z: c.z+faceAxis.z };
        if(inBounds(adj.x, adj.y, adj.z)) adjacentCell = adj;
      }
      return { kind: "block", cell: c, adjacentCell: adjacentCell, faceAxis: faceAxis };
    }
    return { kind: "empty", cell: hit.object.userData.cell };
  }

  // Like resolveHit(), but ignores face-extend semantics entirely and just
  // reports the raw cell (a block's own, or an empty one) closest to the
  // camera — used for the drag-path endpoint during Shift-drag row
  // placement/removal, never for a plain hover/click.
  //
  // A drag sweep is about tracing a line across grid CELLS, not aiming at
  // one specific face, so resolveHit()'s "a real block anywhere along the
  // ray wins over any empty cell" rule is the wrong tool here: it made the
  // drag's current cell violently jump to (or lose entirely, when that
  // face's neighbor was out of bounds) whichever existing block the sweep
  // happened to cross, instead of continuing smoothly through/past it —
  // reported live as dragging "not working" near an already-built
  // structure. placeAt()/removeAt() already silently no-op on a cell
  // where the action doesn't apply (occupied for place, empty for
  // remove), so it's safe for a line to pass straight over either kind.
  function rawCellUnderRay(e){
    const ndc = ndcFromEvent(e);
    raycaster.setFromCamera(ndc, camera);
    const blockMeshes = Array.from(blocks.values()).map(function(b){ return b.mesh; });
    const emptyColliders = cellColliders.filter(function(c){
      const p = c.userData.cell;
      return !blocks.has(cellKey(p.x, p.y, p.z));
    });
    const hits = raycaster.intersectObjects(blockMeshes.concat(emptyColliders), false);
    if(hits.length === 0) return null;
    const hit = hits[0];
    const blockEntry = Array.from(blocks.entries()).find(function(e2){ return e2[1].mesh === hit.object; });
    return blockEntry ? keyToCell(blockEntry[0]) : hit.object.userData.cell;
  }

  // Resolves a raycast hit down to the one cell the CURRENT action (place
  // vs. remove, from Ctrl) actually targets — placing always means "the
  // empty cell itself, or the neighbor next to whichever block's face was
  // hit"; removing always means "the block that was actually hit", never
  // its neighbor. Returns null if that action has no valid target here
  // (e.g. Ctrl-clicking empty space, or a face whose neighbor is already
  // occupied or off-grid).
  function targetCellFor(hit, removing){
    if(!hit) return null;
    if(hit.kind === "empty") return removing ? null : hit.cell;
    if(removing) return hit.cell;
    if(!hit.adjacentCell) return null;
    return blocks.has(cellKey(hit.adjacentCell.x, hit.adjacentCell.y, hit.adjacentCell.z)) ? null : hit.adjacentCell;
  }

  function keyToCell(key){
    const parts = key.split(",").map(Number);
    return { x: parts[0], y: parts[1], z: parts[2] };
  }

  // Standard 3D Bresenham line, inclusive of both endpoints, clipped to
  // the grid — walks along whichever axis has the largest span, stepping
  // the other two only when their accumulated error crosses zero. Handles
  // a plain single-axis row (the common case) as a natural special case
  // of the same algorithm, not a separate code path.
  function lineCells(a, b){
    const cells = [];
    let x=a.x, y=a.y, z=a.z;
    const dx=Math.abs(b.x-a.x), dy=Math.abs(b.y-a.y), dz=Math.abs(b.z-a.z);
    const sx=a.x<b.x?1:-1, sy=a.y<b.y?1:-1, sz=a.z<b.z?1:-1;
    if(dx>=dy && dx>=dz){
      let p1=2*dy-dx, p2=2*dz-dx;
      for(let i=0;i<=dx;i++){
        cells.push({x,y,z});
        if(p1>=0){ y+=sy; p1-=2*dx; }
        if(p2>=0){ z+=sz; p2-=2*dx; }
        p1+=2*dy; p2+=2*dz; x+=sx;
      }
    } else if(dy>=dx && dy>=dz){
      let p1=2*dx-dy, p2=2*dz-dy;
      for(let i=0;i<=dy;i++){
        cells.push({x,y,z});
        if(p1>=0){ x+=sx; p1-=2*dy; }
        if(p2>=0){ z+=sz; p2-=2*dy; }
        p1+=2*dx; p2+=2*dz; y+=sy;
      }
    } else {
      let p1=2*dy-dz, p2=2*dx-dz;
      for(let i=0;i<=dz;i++){
        cells.push({x,y,z});
        if(p1>=0){ y+=sy; p1-=2*dz; }
        if(p2>=0){ x+=sx; p2-=2*dz; }
        p1+=2*dy; p2+=2*dx; z+=sz;
      }
    }
    return cells.filter(function(c){ return inBounds(c.x,c.y,c.z); });
  }

  function placeAt(x, y, z){
    const key = cellKey(x,y,z);
    if(blocks.has(key)) return;
    const mesh = buildBlockMesh(selectedShape.id, selectedColor);
    mesh.position.copy(cellCenterWorld(x,y,z));
    mesh.rotation.y = pendingRotationY * Math.PI/2;
    scene.add(mesh);
    blocks.set(key, { mesh: mesh, category: selectedCategory.id, shape: selectedShape.id, color: selectedColor, rotationY: pendingRotationY });
    updateStatusLine();
  }

  function removeAt(key){
    const entry = blocks.get(key);
    if(!entry) return;
    scene.remove(entry.mesh);
    disposeMesh(entry.mesh);
    blocks.delete(key);
    updateStatusLine();
  }

  // Projects a world point to page pixel coordinates (same space as
  // pointer events' clientX/clientY) — used only to measure on-screen
  // drag distance for axis-locked row extrusion below.
  function worldToScreen(pos){
    const v = pos.clone().project(camera);
    const rect = renderer.domElement.getBoundingClientRect();
    return { x: rect.left + (v.x+1)/2*rect.width, y: rect.top + (1-v.y)/2*rect.height };
  }

  // When a Shift-drag's anchor came from extending a block's face (see
  // resolveHit's faceAxis), the row is locked to that face's normal axis
  // — its length is driven by how far the mouse has moved on screen,
  // projected onto that axis's own on-screen direction, not by raw
  // per-pixel raycasting (rawCellUnderRay). Free-form raycasting works
  // fine for flat/open building (still used when the anchor is a plain
  // empty cell), but is inherently unreliable for "extrude straight out
  // from this face": from anywhere but a near-perfectly axis-aligned
  // camera angle, a drag meant to sweep deeper along the axis just as
  // often re-grazes the very block it started from (or a face with no
  // in-bounds neighbor), snapping the row back to almost nothing instead
  // of continuing — reported live as a drag from a block's underside
  // "catching the walls" instead of continuing further down. Locking to
  // the axis and driving length off screen-space drag distance sidesteps
  // the ambiguity entirely (the common approach block-building games use
  // for extruding a line of blocks out from a placed one).
  function axisStepCell(e){
    if(!dragAxis) return null;
    const stepLenSq = dragAxisStepVec.x*dragAxisStepVec.x + dragAxisStepVec.y*dragAxisStepVec.y;
    const mouseVec = { x: e.clientX - dragAxisStartScreen.x, y: e.clientY - dragAxisStartScreen.y };
    const rawSteps = (mouseVec.x*dragAxisStepVec.x + mouseVec.y*dragAxisStepVec.y) / stepLenSq;
    const n = Math.max(0, Math.round(rawSteps));
    let cell = dragAnchorCell;
    for(let i=0;i<n;i++){
      const next = { x: cell.x+dragAxis.x, y: cell.y+dragAxis.y, z: cell.z+dragAxis.z };
      if(!inBounds(next.x, next.y, next.z)) break;
      cell = next;
    }
    return cell;
  }

  // Ctrl = remove mode, Shift = row mode (place or remove a whole line
  // instead of one cell) — the two combine freely (Ctrl+Shift = remove a
  // row), so there's one interaction model instead of four separate ones.
  let leftDown = false, dragAnchorCell = null;
  let dragAxis = null, dragAxisStartScreen = null, dragAxisStepVec = null;

  renderer.domElement.addEventListener("contextmenu", function(e){ e.preventDefault(); });

  renderer.domElement.addEventListener("pointerdown", function(e){
    if(e.button !== 0) return; // left only — right is the camera (OrbitControls)
    leftDown = true;
    const hit = resolveHit(e);
    const removing = e.ctrlKey;
    dragAnchorCell = targetCellFor(hit, removing);
    dragAxis = null; dragAxisStartScreen = null; dragAxisStepVec = null;
    if(!removing && dragAnchorCell && hit && hit.kind === "block" && hit.faceAxis){
      const anchorScreen = worldToScreen(cellCenterWorld(dragAnchorCell.x, dragAnchorCell.y, dragAnchorCell.z));
      const nx = dragAnchorCell.x+hit.faceAxis.x, ny = dragAnchorCell.y+hit.faceAxis.y, nz = dragAnchorCell.z+hit.faceAxis.z;
      const nextScreen = worldToScreen(cellCenterWorld(nx, ny, nz));
      const stepVec = { x: nextScreen.x-anchorScreen.x, y: nextScreen.y-anchorScreen.y };
      // Require at least ~2px of on-screen movement per cell step to
      // measure against — an axis pointing almost straight at/away from
      // the camera projects to a near-zero step and can't be dragged
      // reliably, so fall back to the free-form sweep in that case.
      if(stepVec.x*stepVec.x + stepVec.y*stepVec.y >= 4){
        dragAxis = hit.faceAxis;
        dragAxisStartScreen = { x: e.clientX, y: e.clientY };
        dragAxisStepVec = stepVec;
      }
    }
  });

  window.addEventListener("pointermove", function(e){
    const removing = e.ctrlKey;
    const dragging = leftDown && e.shiftKey && dragAnchorCell;
    const current = dragging
      ? (dragAxis ? axisStepCell(e) : rawCellUnderRay(e))
      : targetCellFor(resolveHit(e), removing);
    if(!current){ hideGhosts(); return; }
    if(dragging){
      updateGhosts(lineCells(dragAnchorCell, current), removing);
    } else {
      updateGhosts([current], removing);
    }
  });

  window.addEventListener("pointerup", function(e){
    if(e.button !== 0 || !leftDown) return;
    leftDown = false;
    const removing = e.ctrlKey;
    const dragging = e.shiftKey && dragAnchorCell;
    const current = dragging
      ? (dragAxis ? axisStepCell(e) : rawCellUnderRay(e))
      : targetCellFor(resolveHit(e), removing);
    if(!current){ dragAnchorCell = null; dragAxis = null; return; }
    const path = dragging ? lineCells(dragAnchorCell, current) : [current];
    path.forEach(function(cell){
      if(removing) removeAt(cellKey(cell.x, cell.y, cell.z));
      else placeAt(cell.x, cell.y, cell.z);
    });
    dragAnchorCell = null; dragAxis = null;
  });

  window.addEventListener("keydown", function(e){
    if(e.key === "r" || e.key === "R") rotatePending();
  });

  function rotatePending(){
    pendingRotationY = (pendingRotationY + 1) % 4;
    updateStatusLine();
  }

  // ---------- sidebar UI ----------

  function buildPickButtons(containerId, items, isActive, onPick, withSwatch){
    const el = document.getElementById(containerId);
    el.innerHTML = "";
    items.forEach(function(item){
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pickBtn" + (isActive(item) ? " active" : "");
      if(withSwatch){
        const sw = document.createElement("span");
        sw.className = "swatch";
        sw.style.background = item.color;
        btn.appendChild(sw);
      }
      const label = document.createElement("span");
      label.textContent = item.label;
      btn.appendChild(label);
      btn.addEventListener("click", function(){
        onPick(item);
        refreshUI();
      });
      el.appendChild(btn);
    });
  }

  function refreshUI(){
    buildPickButtons("categoryButtons", CATEGORIES, function(c){ return c === selectedCategory; }, function(c){
      selectedCategory = c;
      selectedColor = c.color;
      document.getElementById("colorPicker").value = selectedColor;
    }, true);
    buildPickButtons("shapeButtons", SHAPES, function(s){ return s === selectedShape; }, function(s){
      selectedShape = s;
    }, false);
    document.getElementById("colorPicker").value = selectedColor;
    updateStatusLine();
  }

  function updateStatusLine(){
    document.getElementById("statusLine").innerHTML =
      "Selected: <b>" + selectedCategory.label + "</b> / <b>" + selectedShape.label + "</b><br>" +
      "Rotation: <b>" + (pendingRotationY*90) + "&deg;</b><br>" +
      "Blocks placed: <b>" + blocks.size + "</b> / " + (GRID_SIZE*GRID_SIZE*GRID_SIZE);
  }

  document.getElementById("colorPicker").addEventListener("input", function(e){
    selectedColor = e.target.value;
  });
  document.getElementById("colorResetBtn").addEventListener("click", function(){
    selectedColor = selectedCategory.color;
    document.getElementById("colorPicker").value = selectedColor;
  });
  document.getElementById("rotateBtn").addEventListener("click", rotatePending);
  document.getElementById("clearBtn").addEventListener("click", function(){
    if(blocks.size === 0) return;
    if(!confirm("Remove all " + blocks.size + " placed blocks?")) return;
    Array.from(blocks.keys()).forEach(removeAt);
  });
  document.getElementById("downloadBtn").addEventListener("click", function(){
    // No backend here either (same as planetEditor.html) — a plain JSON export
    // of {x,y,z,category,shape,color,rotationY} per block is the entire
    // "save" mechanism for now.
    const list = Array.from(blocks.entries()).map(function(entry){
      const key = entry[0].split(",").map(Number);
      const b = entry[1];
      return { x: key[0], y: key[1], z: key[2], category: b.category, shape: b.shape, color: b.color, rotationY: b.rotationY };
    });
    const blob = new Blob([JSON.stringify({ gridSize: GRID_SIZE, blocks: list }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "ship.json";
    a.click();
    URL.revokeObjectURL(url);
  });

  refreshUI();

  // ---------- render loop ----------

  function tick(){
    requestAnimationFrame(tick);
    controls.update();
    renderer.render(scene, camera);
  }
  tick();
})();
</script>
</body>
</html>
