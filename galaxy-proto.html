<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Swarm Protocol // Galaxy prototype</title>
<link rel="icon" href="favicon.svg">
<!-- The galaxy map's picture alone (js/galaxy/galaxyRender.js, the same
     module the game uses), full window: scroll to zoom, drag to move.
     ?cx=&cy= (kpc) and ?s= (kpc per px) set the start view. -->
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { createGalaxyRenderer } from "./js/galaxy/galaxyRender.js";
const cv = document.getElementById("c");
const r = createGalaxyRenderer(cv);
const q = new URLSearchParams(location.search);
const view = { cx: +(q.get("cx") || 0), cy: +(q.get("cy") || -1), kpcPerPx: +(q.get("s") || 0.04) };
const draw = () => r.render(view);
draw();
addEventListener("resize", draw);
cv.addEventListener("wheel", e => { view.kpcPerPx *= Math.exp(e.deltaY * 0.001); draw(); });
let d = null;
cv.addEventListener("pointerdown", e => d = [e.clientX, e.clientY]);
addEventListener("pointerup", () => d = null);
addEventListener("pointermove", e => { if(!d) return; view.cx -= (e.clientX - d[0]) * view.kpcPerPx; view.cy += (e.clientY - d[1]) * view.kpcPerPx; d = [e.clientX, e.clientY]; draw(); });
window.ready = true;
</script></body></html>
