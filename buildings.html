<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swarm Protocol // Building lab</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<!-- Planetary base modules (BaseKit, js/basekit/basekit.js — built from
     ShipKit's generators): each module built, as a placement hologram
     (fits / doesn't fit) and under construction. docs/surface.md. -->
<link rel="stylesheet" href="css/lab.css">
<style>
.hidden{ display:none !important; }
#modTabs{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
#modTabs .tBtn{ height:28px; }
.twoBtns{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px; }
#costList .row b{ color:#f8bb56; }
#fpsGraph{ height:40px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="hudTop">
    <div class="mat blue" id="hudBracket"></div>
    <svg id="hudLogo" viewBox="0 0 52 48" aria-hidden="true">
      <defs>
        <linearGradient id="gLogoGold" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ffe0a0"/><stop offset=".5" stop-color="#f8bb56"/><stop offset="1" stop-color="#cf8a35"/></linearGradient>
        <linearGradient id="gLogoBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8c5ff"/><stop offset="1" stop-color="#6d82f5"/></linearGradient>
      </defs>
      <path d="M16 8 L3 24 L16 40 M36 8 L49 24 L36 40" fill="none" stroke="url(#gLogoGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="26" cy="15" r="3.6" fill="url(#gLogoBlue)"/><circle cx="20" cy="30" r="3.6" fill="url(#gLogoBlue)"/><circle cx="32" cy="30" r="3.6" fill="url(#gLogoBlue)"/>
    </svg>
    <div id="hudTitle"></div>
    <div id="hudSub">SWARM PROTOCOL // BUILDING LAB</div>
  </div>
  <div class="mat gold" id="hudBar"></div>
  <div class="hudPanel">
    <div class="mat blue side"></div>
    <div class="secHd first">MODULES</div>
    <div id="modTabs"></div>
    <div class="secHd">VIEW</div>
    <div class="twoBtns">
      <button class="tBtn on" id="vBuilt">BUILT</button>
      <button class="tBtn" id="vOk">GHOST</button>
      <button class="tBtn" id="vBad">BLOCKED</button>
    </div>
    <label class="sl"><span>Construction</span><b id="pVal">100%</b></label>
    <input type="range" id="pSlider" min="0" max="1" step="0.01" value="1">
    <div id="hudBtns">
      <button class="tBtn on" id="btnRotate">AUTO-ROTATE</button>
      <button class="tBtn" id="btnAnim">BUILD IT</button>
    </div>
    <div id="hint">Left-drag: rotate · Right-drag: pan · Scroll: zoom</div>
  </div>
</div>
<div id="opt">
  <div class="hudPanel">
    <div class="mat lilac side"></div>
    <div class="secHd first">MODULE</div>
    <div id="modRows"></div>
    <div class="secHd">MATERIALS (PLANNED)</div>
    <div id="costList"></div>
    <div class="secHd">PERFORMANCE</div>
    <div class="row"><span>Frames per second</span><b id="statFps">–</b></div>
    <div class="row"><span>Frame time</span><b id="statMs">–</b></div>
    <div class="row"><span>CPU per frame</span><b id="statCpu">–</b></div>
    <div class="row"><span>Triangles drawn / frame</span><b id="statTris">–</b></div>
    <div class="row"><span>Draw calls / frame</span><b id="statCalls">–</b></div>
    <canvas id="fpsGraph" width="270" height="40"></canvas>
  </div>
</div>
<script src="vendor/three-r128.min.js"></script>
<script src="vendor/three-r128-examples/OrbitControls.js"></script>
<script src="js/labkit/labkit.js"></script>
<script src="js/shipkit/shipkit.js"></script>
<script src="js/shipkit/ships/codewing.js"></script>
<script src="js/shipkit/ships/scribe.js"></script>
<script src="js/shipkit/ships/swarmer.js"></script>
<script src="js/shipkit/ships/haven.js"></script>
<script src="js/basekit/basekit.js"></script>
<script src="js/labs/buildings.js"></script>
</body>
</html>
