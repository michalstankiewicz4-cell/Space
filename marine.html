<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swarm Protocol // Sea lab</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<!-- Sea vehicles (MarineKit, js/marinekit/marinekit.js): the sea (waves the
     same in JS and GLSL, foam, shallows), the seabed with an island,
     under water (caustics, the sky's window, marine snow), and four robot
     vessels — riding the waves, rising on foils, diving, driving out onto
     the shore. docs/marine.md. -->
<link rel="stylesheet" href="css/lab.css">
<style>
.hidden{ display:none !important; }
#vesTabs{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:6px; }
#vesTabs .tBtn{ height:28px; }
.twoBtns{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; }
.threeBtns{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px; }
#role{ font-size:13px; color:#9fb1ff; margin:4px 0 6px; line-height:1.35; }
#fpsGraph{ height:40px; }
input[type=range]:disabled{ opacity:.35; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="hudTop">
    <div class="mat blue" id="hudBracket"></div>
    <svg id="hudLogo" viewBox="0 0 52 48" aria-hidden="true">
      <defs>
        <linearGradient id="gLogoGold" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ffe0a0"/><stop offset=".5" stop-color="#f8bb56"/><stop offset="1" stop-color="#cf8a35"/></linearGradient>
        <linearGradient id="gLogoBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8c5ff"/><stop offset="1" stop-color="#6d82f5"/></linearGradient>
      </defs>
      <path d="M16 8 L3 24 L16 40 M36 8 L49 24 L36 40" fill="none" stroke="url(#gLogoGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="26" cy="15" r="3.6" fill="url(#gLogoBlue)"/><circle cx="20" cy="30" r="3.6" fill="url(#gLogoBlue)"/><circle cx="32" cy="30" r="3.6" fill="url(#gLogoBlue)"/>
    </svg>
    <div id="hudTitle"></div>
    <div id="hudSub">SWARM PROTOCOL // SEA LAB</div>
  </div>
  <div class="mat gold" id="hudBar"></div>
  <div class="hudPanel">
    <div class="mat blue side"></div>
    <div class="secHd first">VESSELS</div>
    <div id="vesTabs"></div>
    <div id="role"></div>
    <div class="secHd">DRIVE</div>
    <div class="twoBtns">
      <button class="tBtn on" id="dAuto">AUTO</button>
      <button class="tBtn" id="dKeys">WASD</button>
    </div>
    <label class="sl"><span>Speed (auto)</span><b id="sVal">60%</b></label>
    <input type="range" id="sSlider" min="0" max="1" step="0.01" value="0.6">
    <label class="sl"><span>Dive (the diver)</span><b id="dVal">0 m</b></label>
    <input type="range" id="dSlider" min="0" max="45" step="0.5" value="0">
    <div class="secHd">SEA</div>
    <label class="sl"><span>Waves</span><b id="wVal">100%</b></label>
    <input type="range" id="wSlider" min="0" max="2.5" step="0.05" value="1">
    <label class="sl"><span>Depth</span><b id="zVal">30 m</b></label>
    <input type="range" id="zSlider" min="12" max="60" step="1" value="30">
    <div class="threeBtns">
      <button class="tBtn" id="btnNight">NIGHT</button>
      <button class="tBtn on" id="btnWake">WAKE</button>
      <button class="tBtn" id="btnWork">WORK</button>
    </div>
    <div id="hint">WASD: steer · Q / E: dive / rise · Left-drag: orbit the camera (take it under water) · Scroll: zoom</div>
  </div>
</div>
<div id="opt">
  <div class="hudPanel">
    <div class="mat lilac side"></div>
    <div class="secHd first">VESSEL</div>
    <div id="vesRows"></div>
    <div class="secHd">NOW</div>
    <div class="row"><span>Speed</span><b id="nowSpeed">–</b></div>
    <div class="row"><span>Depth</span><b id="nowDepth">–</b></div>
    <div class="row"><span>Camera</span><b id="nowCam">–</b></div>
    <div class="secHd">PERFORMANCE</div>
    <div class="row"><span>Frames per second</span><b id="statFps">–</b></div>
    <div class="row"><span>Frame time</span><b id="statMs">–</b></div>
    <div class="row"><span>CPU per frame</span><b id="statCpu">–</b></div>
    <div class="row"><span>Triangles drawn / frame</span><b id="statTris">–</b></div>
    <div class="row"><span>Draw calls / frame</span><b id="statCalls">–</b></div>
    <canvas id="fpsGraph" width="270" height="40"></canvas>
  </div>
</div>
<script src="vendor/three-r128.min.js"></script>
<script src="vendor/three-r128-examples/OrbitControls.js"></script>
<script src="js/labkit/labkit.js"></script>
<script src="js/shipkit/shipkit.js"></script>
<script src="js/shipkit/ships/codewing.js"></script>
<script src="js/shipkit/ships/scribe.js"></script>
<script src="js/shipkit/ships/swarmer.js"></script>
<script src="js/shipkit/ships/haven.js"></script>
<script src="js/vehiclekit/vehiclekit.js"></script>
<script src="js/marinekit/marinekit.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const MK = window.MarineKit, VK = window.VehicleKit;
const view = $("view");
const renderer = new THREE.WebGLRenderer({ canvas: view, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.environment = ShipKit.makeEnvironment(renderer);
const SKY_DAY = new THREE.Color(0.62, 0.76, 0.9), SKY_NIGHT = new THREE.Color(0.012, 0.018, 0.035);
const UNDER = new THREE.Color(0.05, 0.27, 0.31), UNDER_NIGHT = new THREE.Color(0.003, 0.012, 0.018);
scene.background = SKY_DAY.clone();
scene.fog = new THREE.FogExp2(SKY_DAY.clone(), 0.0025);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1500);
const controls = new THREE.OrbitControls(camera, view);
controls.enableDamping = true; controls.minDistance = 4; controls.maxDistance = 120;
const SUN_DIR = new THREE.Vector3(0.55, 0.62, 0.35).normalize();
const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -25, right: 25, top: 25, bottom: -25, near: 1, far: 200 });
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x1d3a40, 0.6);
scene.add(sun, sun.target, hemi);

const sea = MK.makeSea();
scene.add(sea.floorMesh, sea.ocean);
const wake = MK.makeWake(), snow = MK.makeSnow();
scene.add(wake.points, snow.points);

// ---------- the vessel ----------
const state = { index: 0, auto: true, autoSpeed: 0.6, dive: 0, night: false, wake: true, work: false, keys: {}, target: 0 };
const drv = { x: 0, z: 0, yaw: 0, speed: 0 };
let ves = null;
function load() {
  if (ves) MK.disposeVessel(ves);
  const def = MK.VESSELS[state.index];
  ves = MK.buildVessel(def.id, { detail: 1 });
  scene.add(ves.group);
  drv.speed = 0;
  if (sea.floorAt(drv.x, drv.z) > -3) { drv.x = 0; drv.z = 0; }
  $("hudTitle").textContent = def.name; $("role").textContent = def.role;
  $("btnWork").textContent = def.work.toUpperCase();
  $("dSlider").disabled = !def.maxDepth;
  [...$("vesTabs").children].forEach((b, i) => b.classList.toggle("on", i === state.index));
  const st = MK.modelStats(ves.group);
  const rows = [["Length × width × height", def.length + " × " + def.width + " × " + def.height + " m"], ["Top speed", Math.round(def.maxSpeed * 1.944) + " knots"],
    ["Turns", "in " + def.turnRadius + " m"], ["Cargo", def.cargo + " t"], ["Dives to", def.maxDepth ? def.maxDepth + " m" : "—"],
    ["Triangles", st.triangles.toLocaleString("en-US")], ["Meshes", st.meshes]];
  $("vesRows").textContent = ""; rows.forEach(([k, v]) => $("vesRows").appendChild(row(k, v)));
  const L = def.length;
  camera.position.set(drv.x + L * 1.2, L * 0.55 + 2, drv.z - L * 1.4); controls.target.set(drv.x, 1, drv.z);
}
function row(k, v) { const r = document.createElement("div"); r.className = "row"; const s = document.createElement("span"); s.textContent = k; const b = document.createElement("b"); b.textContent = v; r.append(s, b); return r; }
MK.VESSELS.forEach((d, i) => {
  const b = document.createElement("button"); b.className = "tBtn"; b.textContent = d.name;
  b.addEventListener("click", () => { state.index = i; load(); });
  $("vesTabs").appendChild(b);
});

// ---------- the controls ----------
const toggle = (id, key, after) => $(id).addEventListener("click", () => { state[key] = !state[key]; $(id).classList.toggle("on", state[key]); after && after(); });
$("dAuto").addEventListener("click", () => { state.auto = true; $("dAuto").classList.add("on"); $("dKeys").classList.remove("on"); });
$("dKeys").addEventListener("click", () => { state.auto = false; $("dKeys").classList.add("on"); $("dAuto").classList.remove("on"); });
const slider = (id, valId, fmt, set) => { const el = $(id); el.addEventListener("input", () => { set(+el.value); $(valId).textContent = fmt(+el.value); LabKit.paintSlider(el); }); LabKit.paintSlider(el); };
const pct = (v) => Math.round(v * 100) + "%";
slider("sSlider", "sVal", pct, (v) => { state.autoSpeed = v; });
slider("dSlider", "dVal", (v) => v + " m", (v) => { state.dive = v; });
slider("wSlider", "wVal", pct, (v) => { sea.params.amp = v; });
slider("zSlider", "zVal", (v) => v + " m", (v) => { sea.params.depth = v; sea.params.islandH = v + 6; sea.rebuild(); });
toggle("btnNight", "night");
toggle("btnWake", "wake");
toggle("btnWork", "work");
window.addEventListener("keydown", (e) => {
  state.keys[e.code] = true;
  if (["KeyW", "KeyA", "KeyS", "KeyD", "KeyQ", "KeyE"].includes(e.code) && state.auto) $("dKeys").click();
});
window.addEventListener("keyup", (e) => { state.keys[e.code] = false; });

// ---------- the loop ----------
LabKit.applyGrain();
LabKit.autoHideHud([$("hud"), $("opt")], 5);
const perf = LabKit.perfCounters(renderer);
renderer.info.autoReset = false;
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  LabKit.fitHud([$("hud"), $("opt")], 0.4, 1.3);
}
window.addEventListener("resize", resize);
const clock = new THREE.Clock(), anchor = new THREE.Vector3(), delta = new THREE.Vector3(), tmp = new THREE.Vector3();
const sunCol = new THREE.Color(), skyCol = new THREE.Color();
let wander = 0;
const ISLAND = sea.params.island;
function frame() {
  const t0 = performance.now(), dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const def = ves.def, amph = def.id === "amphibian";
  // the input: keys, or a wandering course (the amphibian shuttles to the island and back)
  let input;
  if (state.auto) {
    wander += dt;
    let steer = Math.sin(wander * 0.21) * 0.6 + Math.sin(wander * 0.53) * 0.25;
    const aim = (x, z) => { const h = Math.atan2(x - drv.x, z - drv.z), d = Math.atan2(Math.sin(h - drv.yaw), Math.cos(h - drv.yaw)); return Math.max(-1, Math.min(1, d * 2)); };
    if (amph) {
      const tg = state.target ? ISLAND : [0, 0];
      if (Math.hypot(tg[0] - drv.x, tg[1] - drv.z) < 12) state.target = 1 - state.target;
      steer = aim(tg[0], tg[1]);
    } else {
      if (Math.hypot(drv.x, drv.z) > 140) steer = aim(0, 0);
      // keep off the island: look ahead
      const ax = drv.x + Math.sin(drv.yaw) * def.length * 2.5, az = drv.z + Math.cos(drv.yaw) * def.length * 2.5;
      if (sea.floorAt(ax, az) > -4) steer = aim(drv.x - (ISLAND[0] - drv.x), drv.z - (ISLAND[1] - drv.z));
    }
    input = { throttle: state.autoSpeed, steer };
  } else {
    const k = state.keys;
    input = { throttle: (k.KeyW ? 1 : 0) - (k.KeyS ? 1 : 0), steer: (k.KeyA ? 1 : 0) - (k.KeyD ? 1 : 0) };
    if (def.maxDepth) { state.dive = Math.max(0, Math.min(45, state.dive + ((k.KeyQ ? 1 : 0) - (k.KeyE ? 1 : 0)) * 4 * dt)); }
  }
  const px = drv.x, pz = drv.z;
  VK.drive(drv, input, def, dt);
  // only the amphibian goes ashore; the others stop at the shallows
  if (!amph && sea.floorAt(drv.x, drv.z) > -(def.id === "barge" ? 2.5 : 1.6) - (def.maxDepth ? 0 : 0)) { drv.x = px; drv.z = pz; drv.speed *= -0.2; }
  ves.group.position.set(drv.x, 0, drv.z); ves.group.rotation.y = drv.yaw;
  const cy = Math.cos(drv.yaw), sy = Math.sin(drv.yaw);
  const wx = (x, z) => drv.x + x * cy + z * sy, wz = (x, z) => drv.z - x * sy + z * cy;
  ves.update(t, dt, {
    speed: drv.speed, steer: input.steer, dive: state.dive,
    surface: (x, z) => sea.height(wx(x, z), wz(x, z), t),
    floor: (x, z) => sea.floorAt(wx(x, z), wz(x, z)),
    lights: state.night ? 1 : (ves.depth > 6 ? 1 : 0), work: state.work ? 1 : 0, wake: state.wake ? wake : null,
  });
  wake.update(dt, (x, z) => sea.height(x, z, t));
  // the camera rides along (the diver too, down)
  ves.body.getWorldPosition(anchor);
  delta.copy(anchor).sub(controls.target); delta.y -= 1;
  camera.position.add(delta); controls.target.add(delta);
  controls.update();
  // above or under the water: fog, light, sky
  const under = sea.underwater(camera, t);
  const camDepth = Math.max(0, sea.height(camera.position.x, camera.position.z, t) - camera.position.y);
  const night = state.night;
  sunCol.setRGB(1, 0.96, 0.9).multiplyScalar(night ? 0.04 : 1);
  skyCol.copy(night ? SKY_NIGHT : SKY_DAY);
  sun.intensity = (night ? 0.08 : 2.2) * (under ? Math.exp(-camDepth * 0.05) : 1);
  hemi.intensity = (night ? 0.05 : 0.6) * (under ? Math.exp(-camDepth * 0.04) : 1);
  const uf = sea.uniforms.uUnderFog.value.copy(night ? UNDER_NIGHT : UNDER).multiplyScalar(Math.exp(-camDepth * 0.025));
  if (under) { scene.background.copy(uf); scene.fog.color.copy(uf); scene.fog.density = 0.035; }
  else { scene.background.copy(skyCol); scene.fog.color.copy(skyCol); scene.fog.density = 0.0025; }
  sea.update(t, { camera, sunDir: SUN_DIR, sunColor: sunCol, sky: skyCol, night, under });
  snow.points.visible = under; snow.update(t, camera); snow.material.uniforms.uLight.value = night ? 0.15 : Math.exp(-camDepth * 0.03);
  wake.material.uniforms.uLight.value = night ? 0.15 : 1;
  sun.position.copy(anchor).addScaledVector(SUN_DIR, 80); sun.target.position.copy(anchor);
  $("nowSpeed").textContent = Math.round(Math.abs(drv.speed) * 1.944) + " knots";
  $("nowDepth").textContent = def.maxDepth ? ves.depth.toFixed(1) + " m" : amph ? (ves.onLand ? "on land" : "afloat") : "afloat";
  $("nowCam").textContent = under ? "under water (" + camDepth.toFixed(1) + " m)" : "above water";
  renderer.info.reset();
  renderer.render(scene, camera);
  perf.update(performance.now(), performance.now() - t0);
  requestAnimationFrame(frame);
}
resize(); load();
frame();
window.seaLab = { state, drv, sea, load, get ves() { return ves; }, camera, controls };
})();
</script>
</body>
</html>
